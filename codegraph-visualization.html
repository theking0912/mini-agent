// Setup
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false});

var W,H, nodes=DATA.nodes, edges=DATA.edges, areaColors=DATA.areaColors;
var nodeMap={},adj={};
nodes.forEach(function(n){nodeMap[n.id]=n;adj[n.id]={out:[],inp:[]};});
edges.forEach(function(e){if(adj[e.source])adj[e.source].out.push(e);if(adj[e.target])adj[e.target].inp.push(e);});

// Merge duplicates
var areaMerge={'pets':'pet','orders':'order','services':'service','notifications':'notification','members':'member','products':'product','users':'user','customers':'customer'};
nodes.forEach(function(n){if(areaMerge[n.area])n.area=areaMerge[n.area];});

// Redundant detection
var edgeRefs=new Set();
DATA.edges.forEach(function(e){edgeRefs.add(e.source);edgeRefs.add(e.target);});
nodes.forEach(function(n){if(!edgeRefs.has(n.id))n.area='redundant';});
DATA.areaColors['redundant']='#94a3b8';

var areaCounts={};
nodes.forEach(function(n){areaCounts[n.area]=(areaCounts[n.area]||0)+1;});
var topAreas=Object.entries(areaCounts).sort(function(a,b){return b[1]-a[1];});

// Canvas sizing
function fitCanvas(){W=window.innerWidth;H=window.innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.scale(devicePixelRatio,devicePixelRatio);}
fitCanvas();window.addEventListener('resize',fitCanvas);
var cam={x:0,y:0,zoom:1};
function w2s(wx,wy){return [(wx-cam.x)*cam.zoom+W/2,(wy-cam.y)*cam.zoom+H/2];}
function s2w(sx,sy){return [(sx-W/2)/cam.zoom+cam.x,(sy-H/2)/cam.zoom+cam.y];}
function autoFit(){var a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;nodes.forEach(function(n){if(n.x<a)a=n.x;if(n.x>b)b=n.x;if(n.y<c)c=n.y;if(n.y>d)d=n.y;});cam.x=(a+b)/2;cam.y=(c+d)/2;cam.zoom=Math.min(W/(b-a+200),H/(d-c+200),1.2);}
function getRadius(n){return n.kind==='class'?5:n.kind==='method'?4:3.5;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var hoveredNode=null,selectedNode=null;

// Area bounds
var areaBounds={};
nodes.forEach(function(n){if(!areaBounds[n.area])areaBounds[n.area]={minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity};var b=areaBounds[n.area];if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});

// Edge count per area for ordering
var areaEdgeCount={};
Object.keys(areaCounts).forEach(function(a){areaEdgeCount[a]=0;});
edges.forEach(function(e){var sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn)return;if(sn.area===tn.area){areaEdgeCount[sn.area]++;}else{areaEdgeCount[sn.area]++;areaEdgeCount[tn.area]++;}});
var sortedAreas=Object.keys(areaCounts).sort(function(a,b){return (areaEdgeCount[b]||0)-(areaEdgeCount[a]||0);});

// Grid layout
var mw=0,mh=0;
sortedAreas.forEach(function(a){var b=areaBounds[a],w=b.maxX-b.minX,h=b.maxY-b.minY;if(w>mw)mw=w;if(h>mh)mh=h;});
var cw=mw+100,ch=mh+80,gcols=Math.max(1,Math.ceil(Math.sqrt(sortedAreas.length)));
sortedAreas.forEach(function(a,i){var col=i%gcols,row=Math.floor(i/gcols),tx=col*cw+cw/2,ty=row*ch+ch/2,b=areaBounds[a];var dx=tx-(b.minX+b.maxX)/2,dy=ty-(b.minY+b.maxY)/2;nodes.filter(function(n){return n.area===a;}).forEach(function(n){n.x+=dx;n.y+=dy;});});
Object.keys(areaBounds).forEach(function(k){var b=areaBounds[k];b.minX=Infinity;b.maxX=-Infinity;b.minY=Infinity;b.maxY=-Infinity;});
nodes.forEach(function(n){var b=areaBounds[n.area];if(!b)return;if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});

// Radiation within areas
(function(){Object.keys(areaBounds).forEach(function(area){var an=nodes.filter(function(n){return n.area===area;});if(an.length<3)return;var ec={};an.forEach(function(n){ec[n.id]=0;});edges.forEach(function(e){if(ec[e.source]!==undefined)ec[e.source]++;if(ec[e.target]!==undefined)ec[e.target]++;});var vals=Object.values(ec),mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),rng=mx-mn||1;var cx=(areaBounds[area].minX+areaBounds[area].maxX)/2,cy=(areaBounds[area].minY+areaBounds[area].maxY)/2,bw=areaBounds[area].maxX-areaBounds[area].minX,bh=areaBounds[area].maxY-areaBounds[area].minY,mr=Math.max(bw,bh)*0.42;an.forEach(function(n){var e=ec[n.id]||0,nor=1-(e-mn)/rng,d=nor*nor*mr,ang=Math.atan2(n.y-cy,n.x-cx)||Math.random()*Math.PI*2;n.x=cx+Math.cos(ang)*d;n.y=cy+Math.sin(ang)*d;});});Object.keys(areaBounds).forEach(function(a){var b=areaBounds[a];b.minX=Infinity;b.maxX=-Infinity;b.minY=Infinity;b.maxY=-Infinity;});nodes.forEach(function(n){var b=areaBounds[n.area];if(!b)return;if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});})();

// Legend
var legendDiv=document.getElementById('legend');
var hiddenAreas=new Set(),hoveredArea=null;
function buildLegend(){var h='<div class="legend-title">按功能分组</div><div class="legend-grid">';topAreas.forEach(function(a){var area=a[0],count=a[1];var co=areaColors[area]||'#64748b',hid=hiddenAreas.has(area);h+='<div class="legend-item" style="cursor:pointer;opacity:'+(hid?'.3':'1')+'" onclick="toggleArea(''+area+'')" onmouseenter="hoveredArea=''+area+'';render()" onmouseleave="hoveredArea=null;render()"><span class="legend-dot" style="background:'+co+';'+(hid?'background:#475569':'')+'"></span>'+(areaLabels[area]||area)+' '+count+'</div>';});var fa=topAreas.filter(function(a){return !hiddenAreas.has(a[0]);});h+='</div><div style="display:flex;justify-content:space-between;margin-top:5px;border-top:1px solid rgba(203,213,225,.2);padding-top:4px"><span style="font-size:9px;color:#475569">'+(hiddenAreas.size?fa.length+'/'+topAreas.length:'全部')+'</span><span style="display:flex;gap:6px"><span onclick="selectAll()" style="font-size:9px;color:#FF6B35;cursor:pointer;font-weight:600">全选</span><span onclick="deselectAll()" style="font-size:9px;color:#94a3b8;cursor:pointer">全不选</span></span></div>';legendDiv.innerHTML=h;}
function toggleArea(a){if(hiddenAreas.has(a))hiddenAreas.delete(a);else hiddenAreas.add(a);if(hiddenAreas.size>=topAreas.length)hiddenAreas.clear();buildLegend();render();}

document.getElementById('zoomIn').addEventListener('click',function(){cam.zoom*=1.3;render();});
document.getElementById('zoomOut').addEventListener('click',function(){cam.zoom/=1.3;render();});
document.getElementById('reset').addEventListener('click',function(){autoFit();panel.classList.remove('open');selectedNode=null;hoveredNode=null;render();});
document.getElementById('toggleLegend').addEventListener('click',function(){legendDiv.classList.toggle('show');});

// Interaction
var isDrag=false,dsX,dsY,csX,csY,clickNode=null,dragArea=null,adX,adY;
canvas.addEventListener('mousedown',function(e){var w=s2w(e.clientX,e.clientY);clickNode=hitTest(w[0],w[1]);isDrag=false;dragArea=null;if(!clickNode){for(var a in areaBounds){if(hiddenAreas.has(a))continue;var b=areaBounds[a];if(w[0]>=b.minX-20&&w[0]<=b.maxX+20&&w[1]>=b.minY-20&&w[1]<=b.minY-20+22/cam.zoom+4){dragArea=a;adX={};adY={};nodes.filter(function(n){return n.area===a;}).forEach(function(n){adX[n.id]=n.x;adY[n.id]=n.y;});canvas.style.cursor='move';break;}}}dsX=e.clientX;dsY=e.clientY;csX=cam.x;csY=cam.y;});
canvas.addEventListener('mousemove',function(e){var w=s2w(e.clientX,e.clientY);var hit=hitTest(w[0],w[1]);if(hit!==hoveredNode){hoveredNode=hit;render();}canvas.style.cursor=hoveredNode?'pointer':(dragArea?'move':'grab');if(hit){tooltip.style.display='block';var kc=kindColors[hit.kind]||'#94a3b8';tooltip.innerHTML='<b style="color:'+kc+'">'+esc(hit.name)+'</b> <span style="color:#94a3b8;font-size:11px">'+(areaLabels[hit.area]||hit.area)+' &middot; '+hit.file+(hit.line?':'+hit.line:'')+'</span>';var tx=e.clientX+14,ty=e.clientY-10;tooltip.style.left=Math.max(4,tx)+'px';tooltip.style.top=Math.max(4,ty)+'px';}else tooltip.style.display='none';if(e.buttons===0){isDrag=false;dragArea=null;return;}var dx=e.clientX-dsX,dy=e.clientY-dsY;if(!isDrag&&!dragArea&&dx*dx+dy*dy<25)return;if(dragArea){var ddx=dx/cam.zoom,ddy=dy/cam.zoom;nodes.filter(function(n){return n.area===dragArea;}).forEach(function(n){n.x=adX[n.id]+ddx;n.y=adY[n.id]+ddy;});var b=areaBounds[dragArea];b.minX=Infinity;b.maxX=-Infinity;b.minY=Infinity;b.maxY=-Infinity;nodes.filter(function(n){return n.area===dragArea;}).forEach(function(n){if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});isDrag=true;canvas.style.cursor='move';render();return;}isDrag=true;cam.x=csX-(e.clientX-dsX)/cam.zoom;cam.y=csY-(e.clientY-dsY)/cam.zoom;canvas.style.cursor='grabbing';render();});
canvas.addEventListener('mouseup',function(e){var h=hoveredNode||clickNode;if(!isDrag){if(h)openPanel(h);else{panel.classList.remove('open');selectedNode=null;render();}}isDrag=false;clickNode=null;dragArea=null;canvas.style.cursor=hoveredNode?'pointer':'grab';});
canvas.addEventListener('mouseleave',function(){isDrag=false;clickNode=null;dragArea=null;canvas.style.cursor='grab';});
canvas.addEventListener('wheel',function(e){e.preventDefault();var d=e.deltaY>0?0.9:1.1;var w=s2w(e.clientX,e.clientY);cam.zoom=Math.max(0.05,Math.min(3,cam.zoom*d));cam.x=w[0]-(e.clientX-W/2)/cam.zoom;cam.y=w[1]-(e.clientY-H/2)/cam.zoom;render();},{passive:false});

var touches=[],lastTouchDist=0,touchSN=null;
canvas.addEventListener('touchstart',function(e){e.preventDefault();touches=Array.from(e.touches);if(touches.length===1){var w=s2w(touches[0].clientX,touches[0].clientY);touchSN=hitTest(w[0],w[1]);isDrag=false;dsX=touches[0].clientX;dsY=touches[0].clientY;csX=cam.x;csY=cam.y;}else if(touches.length===2){touchSN=null;lastTouchDist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);csX=cam.x;csY=cam.y;isDrag=true;}},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();var t=Array.from(e.touches);if(t.length===1){var dx=t[0].clientX-dsX,dy=t[0].clientY-dsY;if(!isDrag&&dx*dx+dy*dy<25)return;isDrag=true;cam.x=csX-(t[0].clientX-dsX)/cam.zoom;cam.y=csY-(t[0].clientY-dsY)/cam.zoom;render();}else if(t.length===2){var dist=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),scale=dist/lastTouchDist;var midX=(t[0].clientX+t[1].clientX)/2,midY=(t[0].clientY+t[1].clientY)/2;var w=s2w(midX,midY);var nz=Math.max(0.05,Math.min(3,cam.zoom*scale));cam.x=w[0]-(midX-W/2)/nz;cam.y=w[1]-(midY-H/2)/nz;cam.zoom=nz;lastTouchDist=dist;render();}},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();if(!isDrag){var h=hoveredNode||touchSN;if(h)openPanel(h);}isDrag=false;touchSN=null;touches=[];},{passive:false});

function hitTest(mx,my){var best=null,bd=Infinity;for(var i=0;i<nodes.length;i++){var n=nodes[i];var dx=n.x-mx,dy=n.y-my,d=Math.sqrt(dx*dx+dy*dy);if(d<getRadius(n)+20/cam.zoom&&d<bd){best=n;bd=d;}}return best;}

// Render
function render(){ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,W,H);if(!nodes.length)return;
var act=hoveredNode||selectedNode;
var hlN=new Set(),hlE=new Set();
if(act){hlN.add(act.id);adj[act.id].out.forEach(function(e){hlN.add(e.target);});adj[act.id].inp.forEach(function(e){hlN.add(e.source);});adj[act.id].out.forEach(function(e){hlE.add(e.source+'=>'+e.target);});adj[act.id].inp.forEach(function(e){hlE.add(e.source+'=>'+e.target);});}
var nf=hiddenAreas.size?function(n){return !hiddenAreas.has(n.area);}:function(){return true;};
var ef=hiddenAreas.size?function(e){var sn=nodeMap[e.source],tn=nodeMap[e.target];return sn&&tn&&!hiddenAreas.has(sn.area)&&!hiddenAreas.has(tn.area);}:function(){return true;};
// Edges
for(var i=0;i<edges.length;i++){var e=edges[i];if(!ef(e))continue;var sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn)continue;var s=w2s(sn.x,sn.y),t=w2s(tn.x,tn.y);var ek=e.source+'=>'+e.target,isH=act&&hlE.has(ek);var a=act?(isH?0.7:0.18):0.15;ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(t[0],t[1]);var ec=edgeColors[e.kind]||'rgba(148,163,184,';ctx.strokeStyle=ec+a+')';ctx.lineWidth=isH?2:0.8;ctx.stroke();}
// Flow pulses
for(var i=0;i<animPulses.length;i++){var p=animPulses[i];if(p.progress<0||p.progress>1)continue;var e=p.edge;if(!ef(e))continue;var sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn)continue;var t=Math.min(1,Math.max(0,p.progress));var px=sn.x+(tn.x-sn.x)*t,py=sn.y+(tn.y-sn.y)*t;var s=w2s(px,py);var ps=Math.max(3,1.5*cam.zoom),al=1-Math.abs(t-0.5)*1.2;var ec2=edgeColors[e.kind]||'rgba(148,163,184,';var g=ctx.createRadialGradient(s[0],s[1],0,s[0],s[1],ps*glowMultiplier);g.addColorStop(0,ec2+al+')');g.addColorStop(1,ec2+'0)');ctx.beginPath();ctx.arc(s[0],s[1],ps*glowMultiplier,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(s[0],s[1],Math.max(2,ps*0.5),0,Math.PI*2);ctx.fillStyle=ec2+al+')';ctx.fill();}
// Area boxes
for(var area in areaBounds){if(hiddenAreas.size&&hiddenAreas.has(area))continue;var b=areaBounds[area];var bn=nodes.filter(function(n){return n.area===area;});if(bn.length<2)continue;var s=w2s(b.minX-20,b.minY-20),e=w2s(b.maxX+20,b.maxY+20);var bw=e[0]-s[0],bh=e[1]-s[1];if(bw<2||bh<2)continue;var c=areaColors[area]||'#94a3b8',iaH=hoveredArea&&area===hoveredArea,iD=hoveredArea&&area!==hoveredArea;ctx.fillStyle=c+(iaH?'30':iD?'08':'18');ctx.beginPath();ctx.roundRect(s[0],s[1],bw,bh,10);ctx.fill();ctx.fillStyle=c+(iaH?'60':iD?'15':'40');ctx.beginPath();ctx.roundRect(s[0],s[1],bw,22,10);ctx.fill();ctx.strokeStyle=c+(iaH?'60':iD?'10':'35');ctx.lineWidth=iaH?2:1;ctx.beginPath();ctx.roundRect(s[0],s[1],bw,bh,10);ctx.stroke();var lb=areaLabels[area]||area;ctx.font=(iaH?'bold 12px':'bold 10px')+' sans-serif';ctx.fillStyle=iD?'#94a3b8':'#0f172a';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(lb,s[0]+8,s[1]+11);}
// Nodes
var lbs=[];
for(var i=0;i<nodes.length;i++){var n=nodes[i];if(!nf(n))continue;var s=w2s(n.x,n.y),r=Math.max(2,getRadius(n)*cam.zoom);var isH=n===hoveredNode,isS=n===selectedNode,isA=act&&hlN.has(n.id);var aDim=hoveredArea&&n.area!==hoveredArea?0.15:1;var a=isH||isS?1:isA?0.85:act?0.12:0.7;a*=aDim;if(a<0.05)continue;var c=kindColors[n.kind]||'#94a3b8',ac=areaColors[n.area]||'#94a3b8';if(isH||isS){var g=ctx.createRadialGradient(s[0],s[1],0,s[0],s[1],r*4);g.addColorStop(0,c+'44');g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(s[0],s[1],r*4,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}ctx.globalAlpha=a*0.18;ctx.beginPath();ctx.arc(s[0],s[1],r+18,0,Math.PI*2);ctx.fillStyle=ac;ctx.fill();ctx.globalAlpha=a*0.7;ctx.beginPath();ctx.arc(s[0],s[1],r+3,0,Math.PI*2);ctx.strokeStyle=ac;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(s[0],s[1],r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(isH||isS){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.globalAlpha=0.8;ctx.stroke();}ctx.globalAlpha=1;if(cam.zoom>0.4||isH||isS)lbs.push({n:n,sx:s[0],sy:s[1],isH:isH,isS:isS,a:a});}
lbs.sort(function(a,b){return (b.isH||b.isS?2:1)-(a.isH||a.isS?2:1);});
var pl=[];
for(var li=0;li<lbs.length;li++){var it=lbs[li];var n=it.n,sx=it.sx,sy=it.sy,isH=it.isH,isS=it.isS,a=it.a;var la=0.4+a*0.4;if(isH||isS)la=1;if(la<0.3)continue;var lb=n.name;if(lb.length>24)lb=lb.slice(0,22)+'...';var fs=isH||isS?11:10;ctx.font=fs+'px sans-serif';var tw=ctx.measureText(lb).width;var tx=sx+8+getRadius(n),ty=sy+3,conf=false;for(var pi=0;pi<pl.length;pi++){var p=pl[pi];if(Math.abs(p.x-tx)<p.w+tw+8&&Math.abs(p.y-ty)<16){conf=true;break;}}if(isH||isS||!conf){var nx=tx;ctx.font=fs+'px sans-serif';ctx.fillStyle='rgba(255,255,255,'+la*0.9+')';ctx.beginPath();ctx.roundRect(nx,ty-fs*0.8,tw+6,fs+6,3);ctx.fill();ctx.fillStyle=isH?'#0f172a':(kindColors[n.kind]||'#475569');ctx.globalAlpha=la;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(lb,nx+3,ty);ctx.globalAlpha=1;pl.push({x:nx,y:ty,w:tw+6});}}
document.getElementById('nodeCount').textContent=nodes.filter(nf).length;
}

// Init
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){if(r>w/2)r=w/2;if(r>h/2)r=h/2;this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);};}
autoFit();loading.classList.add('hidden');initFlow();requestAnimationFrame(function(){render();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){panel.classList.remove('open');selectedNode=null;hoveredNode=null;render();}});
</script>
