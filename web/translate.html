<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 阅读器 - Mini Agent</title>
<style>
:root {
  --bg: #0f0f13;
  --surface: #1a1a24;
  --surface2: #252535;
  --surface3: #2e2e42;
  --border: #2e2e42;
  --text: #e4e4ed;
  --text2: #9090a8;
  --text3: #63637a;
  --primary: #6c5ce7;
  --primary-dim: #4834d4;
  --success: #00b894;
  --warn: #fdcb6e;
  --error: #e17055;
  --radius: 10px;
  --radius-sm: 6px;
  --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  height: 48px;
}
header h1 { font-size: 15px; font-weight: 600; }
header h1 span { color: var(--primary); }
header .sidebar-toggle {
  background: none; border: none; color: var(--text2);
  font-size: 16px; cursor: pointer; padding: 2px 4px;
  border-radius: var(--radius-sm); line-height: 1;
  transition: color .1s, background .1s;
}
header .sidebar-toggle:hover { color: var(--text); background: var(--surface2); }
header .nav { margin-left: auto; display: flex; gap: 8px; align-items: center; }
header .nav a { color: var(--text2); text-decoration: none; font-size: 12px; }
header .nav a:hover { color: var(--primary); }
header .nav .user { color: var(--text3); font-size: 11px; }

/* ── Body layout ── */
.body-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Left: Bookshelf ── */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .2s, min-width .2s;
}
.sidebar.collapsed {
  width: 0;
  min-width: 0;
  border-right: none;
}
.sidebar.collapsed > * { display: none; }
.sidebar-top {
  padding: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-top .url-row { display: flex; gap: 6px; }
.sidebar-top .url-row input {
  flex: 1;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
  font-size: 12px;
  outline: none;
  min-width: 0;
}
.sidebar-top .url-row input:focus { border-color: var(--primary); }
.sidebar-top .url-row .btn {
  padding: 7px 10px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 11px;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dim); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }

/* ── Translate Progress Button ── */
.translate-progress {
  position: relative;
  overflow: hidden;
  padding: 5px 10px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 11px;
  cursor: pointer;
  font-weight: 500;
  background: var(--primary);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 70px;
  height: 26px;
}
.translate-progress .tpf {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: rgba(255,255,255,.18);
  width: 0%;
  transition: width .25s ease;
  pointer-events: none;
}
.translate-progress span {
  position: relative;
  z-index: 1;
  white-space: nowrap;
}
.btn-outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { background: var(--surface2); }
.btn-sm { padding: 5px 8px; font-size: 11px; }
.btn-xs { padding: 3px 6px; font-size: 10px; }

/* ── Collection list ── */
.collection-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.collection-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  cursor: pointer;
  transition: background .1s;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  user-select: none;
}
.collection-header:hover { background: var(--surface2); }
.collection-header .arrow { color: var(--text3); font-size: 10px; width: 14px; }
.collection-header .icon { flex-shrink: 0; }
.collection-header .name { flex: 1; min-width: 0; }
.collection-header .count { color: var(--text3); font-size: 10px; }
.collection-header .actions { display: none; gap: 4px; }
.collection-header:hover .actions { display: flex; }

/* ── Document items ── */
.doc-items { display: none; }
.doc-items.open { display: block; }
.doc-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 6px 32px;
  cursor: pointer;
  transition: background .1s;
  font-size: 12px;
  border-left: 3px solid transparent;
}
.doc-item:hover { background: var(--surface2); }
.doc-item.active {
  background: rgba(108,92,231,.12);
  border-left-color: var(--primary);
}
.doc-item .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-item .badge { font-size: 10px; flex-shrink: 0; }
.doc-item .badge.analyzed { color: var(--text3); }
.doc-item .badge.partial { color: var(--warn); }
.doc-item .badge.complete { color: var(--success); }
.doc-item .char-count { color: var(--text3); font-size: 10px; flex-shrink: 0; }

/* ── Empty sidebar ── */
.sidebar-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  gap: 4px;
  font-size: 12px;
  padding: 20px;
  text-align: center;
}

/* ── Main area ── */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.main-header {
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  min-height: 42px;
}
.main-header .doc-title {
  font-size: 14px;
  font-weight: 600;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.main-header .actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.main-header .actions .btn { padding: 5px 10px; border: none; border-radius: var(--radius-sm); font-size: 11px; cursor: pointer; font-weight: 500; }
.main-header .view-toggle { display: flex; gap: 2px; }
.main-header .view-toggle .btn {
  background: transparent;
  color: var(--text3);
  border: 1px solid var(--border);
  padding: 4px 8px;
  font-size: 11px;
}
.main-header .view-toggle .btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.main-header .view-toggle .btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.main-header .view-toggle .btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

/* ── Reader content ── */
.reader-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 48px;
}
.reader-content.loading {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Empty state ── */
.empty-state {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  gap: 6px;
}
.empty-state .icon { font-size: 48px; opacity: .4; }
.empty-state p { font-size: 13px; }

/* ── Loading ── */
.loading-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text2);
  font-size: 12px;
}
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top: 2px solid var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Message ── */
.msg {
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  display: none;
  line-height: 1.5;
  margin: 6px 10px;
}
.msg.show { display: block; }
.msg.error { background: rgba(225,112,85,.15); border: 1px solid var(--error); color: var(--error); }
.msg.success { background: rgba(0,184,148,.15); border: 1px solid var(--success); color: var(--success); }
.msg.info { background: rgba(108,92,231,.15); border: 1px solid var(--primary); color: var(--primary); }
.msg.warn { background: rgba(253,203,110,.15); border: 1px solid var(--warn); color: var(--warn); }

/* ── Progress bar ── */
.progress-bar {
  height: 3px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
  display: none;
  margin: 0 10px 4px;
}
.progress-bar.show { display: block; }
.progress-bar .fill {
  height: 100%;
  background: var(--primary);
  width: 0%;
  transition: width .3s ease;
}

/* ── Section heading ── */
.section-heading {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  margin: 28px 0 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.section-heading:first-child { margin-top: 0; }

/* ── Paragraph block (interleaved view) ── */
.para-block {
  margin-bottom: 4px;
  transition: opacity .15s;
}
.para-block.code-block { margin-bottom: 12px; }

/* ── Original text ── */
.para-orig {
  font-size: 14px;
  line-height: 1.75;
  color: var(--text);
  padding: 4px 0;
  position: relative;
}
.para-orig .para-index {
  position: absolute;
  left: -28px;
  top: 6px;
  font-size: 9px;
  color: var(--text3);
  font-family: var(--mono);
  opacity: .5;
}

/* ── Translated text ── */
.para-trans {
  font-size: 14px;
  line-height: 1.75;
  color: var(--success);
  padding: 4px 12px;
  margin-bottom: 8px;
  border-left: 2px solid var(--success);
  background: rgba(0,184,148,.04);
  border-radius: 0 4px 4px 0;
}

/* ── Side-by-side view ── */
.sbs-container { display: flex; gap: 20px; }
.sbs-pane {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
}
.sbs-pane .pane-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.sbs-pane.orig-pane .pane-label { color: var(--text); }
.sbs-pane.trans-pane .pane-label { color: var(--success); }

/* ── Content styles ── */
.para-block p, .para-orig p, .para-trans p { margin-bottom: 6px; }
.para-block h1,.para-block h2,.para-block h3,.para-block h4,
.para-orig h1,.para-orig h2,.para-orig h3,.para-orig h4,
.para-trans h1,.para-trans h2,.para-trans h3,.para-trans h4 {
  color: var(--primary);
  margin: 12px 0 6px;
}
.para-orig h1,.para-orig h2,.para-orig h3,.para-orig h4 { color: var(--text); font-weight: 700; }
.para-block pre, .para-orig pre, .para-trans pre {
  background: var(--surface2);
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
  margin: 8px 0;
}
.para-block code, .para-orig code, .para-trans code {
  background: var(--surface2);
  padding: 1px 4px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 13px;
}
.para-block pre code, .para-orig pre code, .para-trans pre code { background: none; padding: 0; }
.para-block ul,.para-block ol,.para-orig ul,.para-orig ol,.para-trans ul,.para-trans ol {
  padding-left: 20px;
  margin: 6px 0;
}
.para-block li,.para-orig li,.para-trans li { margin: 2px 0; }
.para-block table,.para-orig table,.para-trans table {
  border-collapse: collapse;
  width: 100%;
  margin: 8px 0;
}
.para-block td,.para-block th,.para-orig td,.para-orig th,.para-trans td,.para-trans th {
  border: 1px solid var(--border);
  padding: 6px 10px;
  font-size: 13px;
}
.para-block th,.para-orig th,.para-trans th { background: var(--surface2); }
.para-block blockquote,.para-orig blockquote,.para-trans blockquote {
  border-left: 3px solid var(--primary);
  padding: 6px 12px;
  margin: 8px 0;
  color: var(--text2);
  background: rgba(108,92,231,.06);
  border-radius: 0 4px 4px 0;
}
.para-block a,.para-orig a,.para-trans a { color: var(--primary); text-decoration: underline; }
.para-block img,.para-orig img,.para-trans img { max-width: 100%; border-radius: var(--radius-sm); }

/* ── Status badge ── */
.para-status { font-size: 10px; color: var(--text3); }
.para-status .wait { color: var(--text3); }
.para-status .done { color: var(--success); }
.para-status .error { color: var(--error); }
.para-status .skip { color: var(--warn); }

/* ── Dialog / modal ── */
.dialog-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.dialog-overlay.show { display: flex; }
.dialog {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  min-width: 300px;
  max-width: 400px;
}
.dialog h3 { font-size: 14px; margin-bottom: 12px; }
.dialog input {
  width: 100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 12px;
  outline: none;
  margin-bottom: 10px;
}
.dialog input:focus { border-color: var(--primary); }
.dialog .btn-row { display: flex; gap: 6px; justify-content: flex-end; }

/* ── Chapters dialog ── */
.chapter-list {
  max-height: 300px;
  overflow-y: auto;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.chapter-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
.chapter-item:last-child { border-bottom: none; }
.chapter-item:hover { background: var(--surface2); }
.chapter-item input[type="checkbox"] { flex-shrink: 0; }
.chapter-item .ch-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-item .ch-url { color: var(--text3); font-size: 10px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-count { font-size: 11px; color: var(--text2); margin-bottom: 8px; }
.import-mode {
  display: flex;
  gap: 12px;
  margin: 8px 0;
  padding: 8px 10px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.import-mode label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.chapter-manual-row { display: flex; gap: 6px; margin: 8px 0; }
.chapter-manual-row input { flex: 1; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 11px; outline: none; }
.chapter-manual-row input:focus { border-color: var(--primary); }
.chapter-manual-row .btn { padding: 4px 8px; font-size: 11px; }
.chip-progress-text { font-size: 11px; color: var(--text2); margin-bottom: 4px; }

/* ── Sidebar chapter items ── */
.sidebar-chapter {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 28px;
  font-size: 11px;
  color: var(--text2);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background .15s;
}
.sidebar-chapter:hover { background: var(--surface2); color: var(--text); }
.sidebar-chapter.active { color: var(--primary); background: rgba(108,92,231,.08); }
.sidebar-chapter .sch-icon { font-size: 10px; flex-shrink: 0; }
.sidebar-chapter .sch-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-chapter .sch-loading { font-size: 10px; color: var(--text3); }
.sidebar-chapter .sch-action { font-size: 10px; padding: 1px 5px; border-radius: 3px; cursor: pointer; }
.sidebar-chapter .sch-action:hover { background: var(--surface2); }
.chapter-load-all {
  display: block;
  margin: 4px 10px 4px 28px;
  padding: 4px 10px;
  font-size: 10px;
  color: var(--primary);
  cursor: pointer;
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  text-align: center;
  transition: background .15s;
}
.chapter-load-all:hover { background: var(--surface2); }
.chapter-load-all.loading { opacity: .5; pointer-events: none; }
.chapter-load-all .cla-progress { font-size: 10px; color: var(--text3); margin-left: 4px; }

/* ── Chapter view in reader ── */
.chapter-nav { padding: 10px 0; }
.chapter-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.chapter-nav-item:hover { background: var(--surface2); border-color: var(--primary); }
.chapter-nav-item.active { border-color: var(--primary); background: rgba(108,92,231,.1); }
.chapter-nav-item .cnav-icon { font-size: 14px; flex-shrink: 0; }
.chapter-nav-item .cnav-title { flex: 1; font-size: 13px; font-weight: 500; }
.chapter-nav-item .cnav-arrow { color: var(--text3); font-size: 12px; }
.chapter-nav-item:hover .cnav-arrow { color: var(--primary); }
.chapter-topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.chapter-title-label { font-size: 15px; font-weight: 700; color: var(--primary); }
.chapter-content { line-height: 1.8; font-size: 14px; }
.chapter-content h1, .chapter-content h2, .chapter-content h3,
.chapter-content h4 { color: var(--primary); margin: 16px 0 8px; }
.chapter-content p { margin: 8px 0; }
.chapter-content pre { background: var(--surface2); padding: 12px 16px; border-radius: var(--radius-sm); overflow-x: auto; margin: 8px 0; }
.chapter-content code { background: var(--surface2); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
.chapter-content pre code { background: none; padding: 0; }
.chapter-content blockquote { border-left: 3px solid var(--primary); padding: 6px 12px; margin: 8px 0; color: var(--text2); background: rgba(108,92,231,.06); border-radius: 0 4px 4px 0; }
.chapter-content ul, .chapter-content ol { padding-left: 20px; margin: 6px 0; }
.chapter-content img { max-width: 100%; border-radius: var(--radius-sm); }
.chapter-content table { border-collapse: collapse; width: 100%; margin: 8px 0; }
.chapter-content td, .chapter-content th { border: 1px solid var(--border); padding: 6px 10px; }

/* ── Chapter index ── */
.chapter-index { padding: 10px 0; }

.chapter-import-progress {
  display: none;
  margin-top: 8px;
}
.chapter-import-progress.show { display: block; }
.chip-progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.chip-progress-fill { height: 100%; background: var(--success); width: 0%; transition: width .3s ease; }
</style>
</head>
<body>

<header>
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="折叠/展开书架">☰</button>
  <h1><span>📚</span> 阅读器</h1>
  <div class="nav">
    <span class="user" id="userInfo"></span>
    <a href="/">← 聊天</a>
  </div>
</header>

<div class="body-layout">
  <!-- Left: Bookshelf -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="url-row">
        <input type="url" id="urlInput" placeholder="https://...">
        <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeUrl()">📥 导入</button>
      </div>
      <div class="url-row" style="margin-top:6px">
        <select id="colSelector" style="flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;font-size:12px;outline:none;min-width:0">
          <option value="">← 选择目标书架（默认第一个）</option>
        </select>
      </div>
      <div id="sidebarMsg" class="msg"></div>
    </div>
    <div class="collection-list" id="collectionList">
      <div class="sidebar-empty" id="sidebarEmpty">
        <p>📕 书架为空</p>

<!-- Chapters Import Dialog -->
<div class="dialog-overlay" id="chaptersDialog">
  <div class="dialog" style="min-width:420px;max-width:520px">
    <h3>📑 检测到多章节文档</h3>
    <p style="font-size:11px;color:var(--text3);margin-bottom:8px">
      当前页面包含指向其他章节的链接。请选择要导入的章节：
    </p>
    <div class="chapter-count" id="chaptersCount"></div>
    <div class="chapter-list" id="chaptersList"></div>
    <div class="chapter-manual-row">
      <input type="url" id="manualChapterUrl" placeholder="手动添加章节 URL...">
      <button class="btn btn-outline btn-xs" onclick="addManualChapter()">➕ 添加</button>
    </div>
    <div class="import-mode" id="importModeGroup">
      <label><input type="radio" name="importMode" value="merge"> 全量导入（一次性下载全部）</label>
      <label><input type="radio" name="importMode" value="structure" checked> 仅加载结构（按需手动加载）</label>
      <label><input type="radio" name="importMode" value="separate"> 每章作为独立文档</label>
    </div>
    <div id="chaptersMsg" class="msg"></div>
    <div class="chapter-import-progress" id="chaptersProgress">
      <div class="chip-progress-text" id="chipProgText"></div>
      <div class="chip-progress-bar"><div class="chip-progress-fill" id="chipProgFill"></div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" onclick="closeChaptersDialog()">取消</button>
      <button class="btn btn-primary btn-sm" id="importChaptersBtn" onclick="startImportChapters()">📥 导入选中章节</button>
    </div>
  </div>

<script>
// ══════════════════════════════════════════════════════════════
// Auth
// ══════════════════════════════════════════════════════════════
const TOKEN = localStorage.getItem('mini_agent_token');
const USER = JSON.parse(localStorage.getItem('mini_agent_user') || '{}');

if (!TOKEN) {
  window.location.href = '/auth';
} else {
  document.getElementById('userInfo').textContent = USER.email || '';
}

// Unified API fetch: auto-handles auth failures and JSON parsing
async function fetchApi(url, opts = {}) {
  const headers = opts.headers || {};
  headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(url, {...opts, headers});
  const data = await res.json();
  // Auth failure (FastAPI default)
  if (data.detail) {
    localStorage.removeItem('mini_agent_token');
    localStorage.removeItem('mini_agent_user');
    window.location.href = '/auth';
  }
  return data;
}

// ══════════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════════
let collections = [];
let currentDocId = null;       // UUID of currently viewing document
let currentDocData = null;     // full data from /api/reader/read/{doc_id}
let currentView = 'interleaved'; // 'interleaved' or 'sbs'
let translating = false;
let abortController = null;

// ══════════════════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════════════════
function showMsg(el, text, type, duration) {
  el.textContent = text;
  el.className = 'msg show ' + type;
  if (duration && type !== 'error') {
    setTimeout(() => { el.className = 'msg'; }, duration);
  }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function formatChars(n) {
  if (n < 1000) return n + '字';
  return (n / 1000).toFixed(1) + 'K字';
}

function findColName(colId) {
  const col = collections.find(c => c.id === colId);
  return col ? col.name : '默认书架';
}

function showProgress(pct) {
  const bar = document.getElementById('progressBar');
  bar.classList.add('show');
  document.getElementById('progressFill').style.width = pct + '%';
}

function hideProgress() {
  document.getElementById('progressBar').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
}


// ══════════════════════════════════════════════════════════════
// Chapters Import
// ══════════════════════════════════════════════════════════════

let currentChaptersDocId = null;
let currentDetectedChapters = [];

function showChaptersDialog(chapters, docId) {
  if (!chapters || !Array.isArray(chapters) || chapters.length === 0) return;
  
  currentChaptersDocId = docId;
  currentDetectedChapters = chapters.slice();

  const list = document.getElementById('chaptersList');
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const title = ch && ch.title ? ch.title : (ch && ch.url ? ch.url.split('/').pop().replace(/[-_]/g, ' ') : '章节 ' + (i+1));
    const url = ch && ch.url ? ch.url : '';
    const item = document.createElement('div');
    item.className = 'chapter-item';
    item.innerHTML = `
      <input type="checkbox" checked data-idx="${i}">
      <span class="ch-title">${escapeHtml(title)}</span>
      <span class="ch-url">${escapeHtml(url)}</span>
    `;
    item.style.display = 'flex';
    // Toggle checkbox on click (but not on the checkbox itself)
    item.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') {
        const cb = item.querySelector('input[type="checkbox"]');
        cb.checked = !cb.checked;
      }
    });
    list.appendChild(item);
  });

  document.getElementById('chaptersCount').textContent = `共 ${chapters.length} 个章节`;
  document.getElementById('chaptersMsg').className = 'msg';
  document.getElementById('chaptersProgress').classList.remove('show');
  document.getElementById('importChaptersBtn').disabled = false;
  document.getElementById('importChaptersBtn').textContent = '📥 导入选中章节';
  document.getElementById('chaptersDialog').classList.add('show');
}

function closeChaptersDialog() {
  document.getElementById('chaptersDialog').classList.remove('show');
}

function addManualChapter() {
  const input = document.getElementById('manualChapterUrl');
  const url = input.value.trim();
  if (!url) return;

  // Extract a title from the URL
  const title = url.split('/').pop().replace(/[-_]/g, ' ') || url;
  const chapters = currentDetectedChapters;

  // Check for duplicates
  if (chapters.some(c => c.url === url)) {
    showMsg(document.getElementById('chaptersMsg'), '该 URL 已在列表中', 'warn', 3000);
    return;
  }

  chapters.push({title: title, url: url});
  input.value = '';

  // Re-render
  const list = document.getElementById('chaptersList');
  const item = document.createElement('div');
  item.className = 'chapter-item';
  const idx = chapters.length - 1;
  item.innerHTML = `
    <input type="checkbox" checked data-idx="${idx}">
    <span class="ch-title">${escapeHtml(title)}</span>
    <span class="ch-url">${escapeHtml(url)}</span>
  `;
  item.addEventListener('click', (e) => {
    if (e.target.tagName !== 'INPUT') {
      const cb = item.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
    }
  });
  list.appendChild(item);

  document.getElementById('chaptersCount').textContent = `共 ${chapters.length} 个章节`;
  showMsg(document.getElementById('chaptersMsg'), `✅ 已添加: ${escapeHtml(title)}`, 'success', 2000);
}

async function startImportChapters() {
  const chapters = currentDetectedChapters;
  const checkboxes = document.querySelectorAll('#chaptersList input[type="checkbox"]');
  const selected = [];
  checkboxes.forEach((cb, i) => {
    if (cb.checked && chapters[i]) {
      selected.push(chapters[i]);
    }
  });

  if (selected.length === 0) {
    showMsg(document.getElementById('chaptersMsg'), '请至少选择一个章节', 'warn', 3000);
    return;
  }

  const mode = document.querySelector('input[name="importMode"]:checked').value;
  const btn = document.getElementById('importChaptersBtn');
  btn.disabled = true;

  const prog = document.getElementById('chaptersProgress');
  prog.classList.add('show');

  if (mode === 'structure') {
    btn.textContent = '⏳ 保存章节结构...';
    document.getElementById('chipProgText').textContent = `0/${selected.length}`;
    document.getElementById('chipProgFill').style.width = '0%';

    try {
      const result = await fetchApi(`/api/reader/import-chapters/${currentChaptersDocId}`, {
        method: 'POST',
        body: JSON.stringify({chapters: selected, mode: 'structure'}),
      });

      if (result.error) {
        showMsg(document.getElementById('chaptersMsg'), '❌ ' + result.error, 'error');
        return;
      }

      const total = result.total || selected.length;
      const succeeded = result.succeeded || 0;
      document.getElementById('chipProgText').textContent = `${succeeded}/${total}`;
      document.getElementById('chipProgFill').style.width = '100%';

      showMsg(document.getElementById('chaptersMsg'), `✅ 章节结构已保存（${succeeded} 个），点击章节即可加载内容`, 'success');

      btn.textContent = '✅ 完成';
      btn.disabled = false;

      // Refresh sidebar - document now has chapters
      await loadCollections();

      // Auto-close dialog and show the document with chapters
      closeChaptersDialog();
      await selectDocument(currentChaptersDocId);

    } catch (e) {
      showMsg(document.getElementById('chaptersMsg'), '❌ 保存失败: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = '📥 导入选中章节';
    }
    return;
  }

  // merge mode - use existing flow with progress bar
  btn.textContent = '⏳ 全量导入中...';
  document.getElementById('chipProgText').textContent = `0/${selected.length}`;
  document.getElementById('chipProgFill').style.width = '0%';

  try {
    const result = await fetchApi(`/api/reader/import-chapters/${currentChaptersDocId}`, {
      method: 'POST',
      body: JSON.stringify({chapters: selected, mode: mode}),
    });

    if (result.error) {
      showMsg(document.getElementById('chaptersMsg'), '❌ ' + result.error, 'error');
      return;
    }

    const total = result.total || selected.length;
    const succeeded = result.succeeded || 0;
    const failed = result.failed || [];

    document.getElementById('chipProgText').textContent = `${succeeded}/${total}`;
    document.getElementById('chipProgFill').style.width = `${(succeeded / total) * 100}%`;

    let msg = `✅ 导入完成：成功 ${succeeded}/${total}`;
    if (failed.length > 0) {
      msg += `，失败 ${failed.length}`;
    }
    showMsg(document.getElementById('chaptersMsg'), msg, succeeded > 0 ? 'success' : 'error');

    if (succeeded > 0) {
      // Refresh sidebar
      await loadCollections();

      if (mode === 'merge') {
        // Re-select the current doc (which now has more sections)
        await selectDocument(currentChaptersDocId);
      }
    }

    btn.textContent = '✅ 完成';
    // Close after 2s if all succeeded
    if (failed.length === 0) {
      setTimeout(closeChaptersDialog, 2000);
    }
  } catch (e) {
    showMsg(document.getElementById('chaptersMsg'), '❌ 导入失败: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '📥 导入选中章节';
  }
}

// ══════════════════════════════════════════════════════════════
// View toggle

async function loadCollections() {
  try {
    collections = await fetchApi('/api/reader/collections');
    renderCollections();
  } catch (e) {
    console.error('Load collections failed:', e);
  }
}

function renderCollections() {
  const list = document.getElementById('collectionList');
  const empty = document.getElementById('sidebarEmpty');
  const sel = document.getElementById('colSelector');

  // Update collection selector
  const prevVal = sel.value;
  sel.innerHTML = '<option value="">← 选择目标书架（默认第一个）</option>';
  if (collections && collections.length > 0) {
    // Keep selected value if still valid
    let found = false;
    collections.forEach(col => {
      const opt = document.createElement('option');
      opt.value = col.id;
      opt.textContent = (col.icon || '📕') + ' ' + col.name;
      sel.appendChild(opt);
      if (col.id === prevVal) found = true;
    });
    if (found) sel.value = prevVal;
  }

  if (!collections || collections.length === 0) {
    list.innerHTML = '';
    list.appendChild(empty);
    return;
  }

  list.innerHTML = '';
  collections.forEach(col => {
    // Collection header
    const header = document.createElement('div');
    header.className = 'collection-header';
    header.dataset.colId = col.id;
    header.innerHTML = `
      <span class="arrow">▶</span>
      <span class="icon">${col.icon || '📕'}</span>
      <span class="name">${escapeHtml(col.name)}</span>
      <span class="count">${col.doc_count || 0}</span>
      <span class="actions">
        <button class="btn btn-xs btn-outline" onclick="showNewDocDialog('${col.id}')" title="导入到此书架">+</button>
        <button class="btn btn-xs btn-outline" onclick="deleteCollection('${col.id}')" title="删除书架">✕</button>
      </span>
    `;
    header.addEventListener('click', (e) => {
      // Don't toggle if clicking action buttons
      if (e.target.tagName === 'BUTTON') return;
      const container = document.getElementById('docs-' + col.id);
      const isOpen = container.classList.contains('open');
      container.classList.toggle('open');
      header.querySelector('.arrow').textContent = isOpen ? '▶' : '▼';
    });

    // Document items container
    const docContainer = document.createElement('div');
    docContainer.className = 'doc-items';
    docContainer.id = 'docs-' + col.id;
    // Load docs on first open
    loadDocItems(col.id, docContainer, 0);

    list.appendChild(header);
    list.appendChild(docContainer);
  });
}

async function loadDocItems(collectionId, container, retries) {
  try {
    const docs = await fetchApi('/api/reader/documents?collection_id=' + encodeURIComponent(collectionId));
    container.innerHTML = '';
    if (!docs || docs.length === 0) {
      container.innerHTML = '<div style="padding:6px 12px 6px 32px;font-size:11px;color:var(--text3)">暂无文档</div>';
      container.classList.add('open');
      return;
    }
    docs.forEach(doc => {
      const item = document.createElement('div');
      item.className = 'doc-item' + (currentDocId === doc.id ? ' active' : '');
      item.dataset.docId = doc.id;
      const statusIcon = doc.status === 'complete' ? '✅' : doc.status === 'partial' ? '🔄' : '📄';
      item.innerHTML = `
        <span class="title">${escapeHtml(doc.title)}</span>
        <span class="char-count">${formatChars(doc.total_chars || 0)}</span>
        <span class="badge ${doc.status}">${statusIcon}</span>
      `;
      item.addEventListener('click', () => selectDocument(doc.id));
      container.appendChild(item);

      // Also load chapters for this doc in sidebar
      loadSidebarChapters(doc.id, item);
    });
  } catch (e) {
    if (retries < 3) {
      setTimeout(() => loadDocItems(collectionId, container, retries + 1), 500);
    }
  }
}

function refreshSidebar() {
  loadCollections();
}

// ── Sidebar chapters ─────────────────────────────────────

/** Load chapters for a document and render them in the sidebar */
async function loadSidebarChapters(docId, docItem) {
  // Remove previous chapter list if any
  const oldChapters = docItem.querySelector('.sidebar-chapters');
  if (oldChapters) oldChapters.remove();

  try {
    const data = await fetchApi('/api/reader/documents/' + encodeURIComponent(docId) + '/chapters');
    if (!data || data.error || !data.chapters || data.chapters.length <= 1) return;

    // Only show chapters if there are multiple or if it's a chapter-mode doc
    const container = document.createElement('div');
    container.className = 'sidebar-chapters';

    // Count pending chapters
    const pendingChap = data.chapters.filter(c => !c.has_content);
    const loadedChap = data.chapters.filter(c => c.has_content);

    data.chapters.forEach((ch, idx) => {
      const chItem = document.createElement('div');
      chItem.className = 'sidebar-chapter' + (ch.has_content ? ' loaded' : ' pending');
      chItem.dataset.secIdx = ch.sec_index;
      const icon = ch.has_content ? '📄' : '🔗';
      const statusText = ch.has_content ? '' : '<span class="sch-action" title="点击加载">⬇</span>';
      chItem.innerHTML = `
        <span class="sch-icon">${icon}</span>
        <span class="sch-title">${escapeHtml(ch.title)}</span>
        ${statusText}
      `;
      // Click always loads content
      chItem.addEventListener('click', () => {
        if (currentDocId === docId) {
          loadChapterContent(ch.sec_index);
        }
        // Select the document first if not currently viewed
        if (currentDocId !== docId) {
          selectDocument(docId).then(() => loadChapterContent(ch.sec_index));
        }
      });
      container.appendChild(chItem);
    });

    // "全量加载" button (only if there are pending chapters)
    if (pendingChap.length > 0) {
      const loadAll = document.createElement('div');
      loadAll.className = 'chapter-load-all';
      loadAll.id = 'loadAllBtn_' + docId.replace(/-/g, '_');
      loadAll.innerHTML = `⬇ 全量加载剩余 ${pendingChap.length} 章`;
      loadAll.addEventListener('click', () => loadAllPendingChapters(docId, loadAll, data.chapters));
      container.appendChild(loadAll);
    }

    docItem.appendChild(container);
  } catch (e) {
    console.error('Load sidebar chapters failed:', e);
  }
}

/** Update a sidebar chapter's status after lazy fetch */
function updateSidebarChapterStatus(secIdx, hasContent) {
  const chItems = document.querySelectorAll('.sidebar-chapter');
  chItems.forEach(el => {
    if (parseInt(el.dataset.secIdx) === secIdx) {
      el.classList.remove('pending');
      el.classList.add('loaded');
      el.querySelector('.sch-icon').textContent = '📄';
      const action = el.querySelector('.sch-action');
      if (action) action.remove();
    }
  });
}

/** Load ALL pending chapters sequentially with progress */
async function loadAllPendingChapters(docId, loadAllBtn, allChapters) {
  if (loadAllBtn.classList.contains('loading')) return;
  loadAllBtn.classList.add('loading');

  const pending = allChapters.filter(c => !c.has_content);
  const total = pending.length;
  let done = 0;
  let failed = 0;

  loadAllBtn.innerHTML = `⏳ 加载中 0/${total}`;

  for (const ch of pending) {
    try {
      const res = await fetch('/api/reader/fetch-chapter/' + encodeURIComponent(docId) + '/' + ch.sec_index, {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'},
      });
      if (res.ok) {
        done++;
        updateSidebarChapterStatus(ch.sec_index, true);
      } else {
        failed++;
      }
    } catch (e) {
      failed++;
    }
    loadAllBtn.innerHTML = `⏳ 加载中 ${done}/${total}`;
  }

  if (failed === 0) {
    loadAllBtn.innerHTML = `✅ 已加载全部 ${total} 章`;
    setTimeout(() => { loadAllBtn.remove(); }, 3000);
  } else {
    loadAllBtn.innerHTML = `✅ ${done}/${total} 加载完成，${failed} 失败`;
    loadAllBtn.classList.remove('loading');
  }
}

// ══════════════════════════════════════════════════════════════
// Document selection
// ══════════════════════════════════════════════════════════════

async function selectDocument(docId) {
  currentDocId = docId;
  currentDocData = null;

  // Highlight in sidebar
  document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector(`.doc-item[data-doc-id="${docId}"]`);
  if (item) item.classList.add('active');

  const reader = document.getElementById('readerContent');
  reader.innerHTML = '<div class="loading-indicator"><div class="spinner"></div><span>加载文档...</span></div>';

  document.getElementById('translateBtn').style.display = 'none';
  document.getElementById('deleteDocBtn').style.display = 'none';
  document.getElementById('engineSelect').style.display = 'none';
  document.getElementById('tencentConfigBtn').style.display = 'none';
  hideProgress();

  try {
    const data = await fetchApi('/api/reader/read/' + encodeURIComponent(docId));
    if (data.error) { showReaderError(data.error); return; }

    currentDocData = data.sections || [];
    document.getElementById('docTitle').textContent = getDocTitle(docId) || '文档';
    document.getElementById('mainHeader').style.display = '';

    // Check if translation is needed
    const hasUntranslated = currentDocData.some(sec =>
      sec.paragraphs.some(p => p.status === 'wait' && !p.skip_translate)
    );
    document.getElementById('translateBtn').style.display = hasUntranslated ? '' : 'none';
    document.getElementById('deleteDocBtn').style.display = '';
    document.getElementById('mergeBtn').style.display = '';
    document.getElementById('engineSelect').style.display = '';
    document.getElementById('tencentConfigBtn').style.display = '';

    renderReader();

    // Refresh sidebar chapters for this doc
    const docItem = document.querySelector(`.doc-item[data-doc-id="${docId}"]`);
    if (docItem) loadSidebarChapters(docId, docItem);
  } catch (e) {
    showReaderError('加载失败: ' + e.message);
  }
}

function getDocTitle(docId) {
  for (const col of collections) {
    const container = document.getElementById('docs-' + col.id);
    if (container) {
      const item = container.querySelector(`.doc-item[data-doc-id="${docId}"]`);
      if (item) return item.querySelector('.title').textContent;
    }
  }
  return '文档';
}

function showReaderError(msg) {
  const reader = document.getElementById('readerContent');
  reader.innerHTML = `<div class="empty-state"><div class="icon" style="font-size:32px">❌</div><p>${escapeHtml(msg)}</p></div>`;
}

// ══════════════════════════════════════════════════════════════
// Render reader
// ══════════════════════════════════════════════════════════════

function renderReader() {
  if (!currentDocData || currentDocData.length === 0) {
    document.getElementById('readerContent').innerHTML =
      '<div class="empty-state"><div class="icon">📄</div><p>文档内容为空</p></div>';
    return;
  }

  const reader = document.getElementById('readerContent');
  reader.innerHTML = '';

  // Check if this is a chapter-mode document (has source_url sections)
  const isChapterMode = currentDocData.some(sec => sec.chapter_mode);

  if (isChapterMode) {
    renderChapterMode(reader);
  } else {
    renderNormalMode(reader);
  }
}

function renderChapterMode(reader) {
  // Show all chapter titles as a navigable list
  // Click to load content from API
  reader.innerHTML = '<div class="chapter-index"><div style="font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:600">📑 选择章节</div></div>';
  const list = reader.querySelector('.chapter-index');

  currentDocData.forEach((sec, secIdx) => {
    const item = document.createElement('div');
    item.className = 'chapter-nav-item';
    item.dataset.secIdx = secIdx;
    item.innerHTML = `
      <span class="cnav-icon">📄</span>
      <span class="cnav-title">${escapeHtml(sec.title || '第 ' + (secIdx + 1) + ' 节')}</span>
      <span class="cnav-arrow">→</span>
    `;
    item.addEventListener('click', () => loadChapterContent(secIdx));
    list.appendChild(item);
  });
}

let currentChapterIndex = null;

async function loadChapterContent(secIdx) {
  const sec = currentDocData[secIdx];
  if (!sec) return;

  const reader = document.getElementById('readerContent');

  // Highlight active chapter nav items
  document.querySelectorAll('.chapter-nav-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.secIdx) === secIdx);
  });

  // Check if this is a pending chapter (structure mode - needs fetch)
  const needsFetch = sec.chapter_mode && (!sec.paragraphs || sec.paragraphs.length === 0 || sec.paragraphs.every(p => !p.orig_html));

  if (needsFetch) {
    // Show loading + fetch from API
    reader.innerHTML = `<div class="loading-indicator"><div class="spinner"></div><span>正在抓取章节内容...</span></div>`;

    try {
      const res = await fetch('/api/reader/fetch-chapter/' + encodeURIComponent(currentDocId) + '/' + secIdx, {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'},
      });
      if (!res.ok) {
        const err = await res.json();
        reader.innerHTML = `<div class="empty-state"><div class="icon" style="font-size:32px">❌</div><p>${escapeHtml(err.error || '加载失败')}</p></div>`;
        return;
      }
      const data = await res.json();

      // Render the chapter content
      reader.innerHTML = `
        <div class="chapter-topbar">
          <button class="btn btn-outline btn-xs" onclick="showChapterIndex()">← 返回目录</button>
          <span class="chapter-title-label">${escapeHtml(data.title || sec.title)}</span>
        </div>
        <div class="chapter-content">${data.html}</div>
      `;

      currentChapterIndex = secIdx;
      document.getElementById('docTitle').textContent = data.title || sec.title || '章节';

      // Update sidebar - mark this chapter as loaded
      updateSidebarChapterStatus(secIdx, true);
      return;
    } catch (e) {
      reader.innerHTML = `<div class="empty-state"><div class="icon" style="font-size:32px">❌</div><p>加载失败: ${escapeHtml(e.message)}</p></div>`;
      return;
    }
  }

  // Already has content - load from existing data or section endpoint
  reader.innerHTML = '<div class="loading-indicator"><div class="spinner"></div><span>加载章节...</span></div>';

  // Highlight in sidebar too
  document.querySelectorAll('.sidebar-chapter').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.secIdx) === secIdx);
  });

  try {
    // Try reading from the paragraph content first
    const origHtml = sec.paragraphs && sec.paragraphs[0] && sec.paragraphs[0].orig_html;
    if (origHtml) {
      reader.innerHTML = `
        <div class="chapter-topbar">
          <button class="btn btn-outline btn-xs" onclick="showChapterIndex()">← 返回目录</button>
          <span class="chapter-title-label">${escapeHtml(sec.title)}</span>
        </div>
        <div class="chapter-content">${origHtml}</div>
      `;
      currentChapterIndex = secIdx;
      document.getElementById('docTitle').textContent = sec.title || '章节';
      return;
    }

    // Fallback: try section API
    const res = await fetch('/api/reader/section/' + encodeURIComponent(currentDocId) + '/' + secIdx, {
      headers: {'Authorization': 'Bearer ' + TOKEN},
    });
    if (!res.ok) {
      reader.innerHTML = `<div class="empty-state"><div class="icon" style="font-size:32px">❌</div><p>加载失败: ${res.status}</p></div>`;
      return;
    }
    const html = await res.text();

    reader.innerHTML = `
      <div class="chapter-topbar">
        <button class="btn btn-outline btn-xs" onclick="showChapterIndex()">← 返回目录</button>
        <span class="chapter-title-label">${escapeHtml(sec.title)}</span>
      </div>
      <div class="chapter-content">${html}</div>
    `;

    currentChapterIndex = secIdx;
    document.getElementById('docTitle').textContent = sec.title || '章节';
  } catch (e) {
    reader.innerHTML = `<div class="empty-state"><div class="icon" style="font-size:32px">❌</div><p>加载失败: ${escapeHtml(e.message)}</p></div>`;
  }
}

function showChapterIndex() {
  currentChapterIndex = null;
  renderReader();
}

function renderNormalMode(reader) {
  currentDocData.forEach((sec, secIdx) => {
    // Section heading
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = sec.title || ('第 ' + (secIdx + 1) + ' 节');
    reader.appendChild(heading);

    // Paragraphs
    sec.paragraphs.forEach((para, pIdx) => {
      const block = document.createElement('div');
      block.className = 'para-block';
      block.dataset.secIdx = secIdx;
      block.dataset.paraIdx = pIdx;

      if (currentView === 'interleaved') {
        renderInterleaved(block, para, secIdx, pIdx);
      } else {
        renderSideBySide(block, para, secIdx, pIdx);
      }

      reader.appendChild(block);
    });
  });
}


function renderInterleaved(block, para, secIdx, pIdx) {
  // Skip translate = code block, show just once
  if (para.skip_translate) {
    block.classList.add('code-block');
    block.innerHTML = `
      <div class="para-orig">${para.orig_html || ''}</div>
      <div class="para-status"><span class="skip">🔧 代码块</span></div>
    `;
    return;
  }

  const origHtml = para.orig_html || '';
  const transHtml = para.trans_html || '';

  // Original
  const origDiv = document.createElement('div');
  origDiv.className = 'para-orig';
  origDiv.innerHTML = `<span class="para-index">#${pIdx+1}</span>${origHtml}`;
  block.appendChild(origDiv);

  // Translation (or placeholder)
  if (para.status === 'done' && transHtml) {
    const transDiv = document.createElement('div');
    transDiv.className = 'para-trans';
    transDiv.innerHTML = transHtml;
    block.appendChild(transDiv);
  } else if (para.status === 'wait') {
    const transDiv = document.createElement('div');
    transDiv.className = 'para-trans';
    transDiv.style.color = 'var(--text3)';
    transDiv.style.borderLeftColor = 'var(--text3)';
    transDiv.style.background = 'none';
    transDiv.textContent = '⏳ 待翻译';
    block.appendChild(transDiv);
  } else if (para.status === 'error') {
    const transDiv = document.createElement('div');
    transDiv.className = 'para-trans';
    transDiv.style.color = 'var(--error)';
    transDiv.style.borderLeftColor = 'var(--error)';
    transDiv.textContent = '❌ 翻译失败';
    block.appendChild(transDiv);
  }
}

function renderSideBySide(block, para, secIdx, pIdx) {
  if (para.skip_translate) {
    block.classList.add('code-block');
    block.innerHTML = `<div class="para-orig" style="padding:0">${para.orig_html || ''}</div>`;
    return;
  }

  const sbs = document.createElement('div');
  sbs.className = 'sbs-container';

  // Left: original
  const origPane = document.createElement('div');
  origPane.className = 'sbs-pane orig-pane';
  origPane.innerHTML = `<div class="pane-label">#${pIdx+1} 原文</div><div>${para.orig_html || ''}</div>`;

  // Right: translation
  const transPane = document.createElement('div');
  transPane.className = 'sbs-pane trans-pane';
  if (para.status === 'done' && para.trans_html) {
    transPane.innerHTML = `<div class="pane-label">#${pIdx+1} 译文</div><div>${para.trans_html}</div>`;
  } else if (para.status === 'wait') {
    transPane.innerHTML = `<div class="pane-label">#${pIdx+1} 译文</div><div style="color:var(--text3)">⏳ 待翻译</div>`;
  } else if (para.status === 'error') {
    transPane.innerHTML = `<div class="pane-label">#${pIdx+1} 译文</div><div style="color:var(--error)">❌ 翻译失败</div>`;
  }

  sbs.appendChild(origPane);
  sbs.appendChild(transPane);
  block.appendChild(sbs);
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('#viewToggle .btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);

  if (currentDocData) renderReader();

// ══════════════════════════════════════════════════════════════
// Import (analyze URL)
// ══════════════════════════════════════════════════════════════

async function analyzeUrl(colId) {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) {
    showMsg(document.getElementById('sidebarMsg'), '请输入 URL', 'error', 3000);
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 分析中...';

  // Reload collections first to ensure we have the latest list
  await loadCollections();

  // Determine target collection: parameter > dropdown > first
  let targetColId = colId || document.getElementById('colSelector').value || null;
  if (!targetColId && collections.length > 0) {
    targetColId = collections[0].id;
  } else if (!targetColId) {
    // Auto-create a default collection if none exists
    try {
      const newCol = await fetchApi('/api/reader/collections', {
        method: 'POST',
        body: JSON.stringify({name: '默认书架'}),
      });
      if (newCol && newCol.id) {
        targetColId = newCol.id;
        await loadCollections();
      }
    } catch (e) {
      showMsg(document.getElementById('sidebarMsg'), '❌ 创建默认书架失败: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = '📥 导入';
      return;
    }
  }

  showMsg(document.getElementById('sidebarMsg'), '⏳ 正在抓取并分析页面...', 'info');

  try {
    const data = await fetchApi('/api/reader/analyze', {
      method: 'POST',
      body: JSON.stringify({url, collection_id: targetColId}),
    });
    if (data.error) {
      showMsg(document.getElementById('sidebarMsg'), '❌ ' + data.error, 'error');
      return;
    }
    showMsg(document.getElementById('sidebarMsg'),
      `✅ 已导入到"${escapeHtml(findColName(data.document.collection_id))}"：${escapeHtml(data.document.title)} (${formatChars(data.document.total_chars)})`,
      'success', 5000);
    document.getElementById('urlInput').value = '';
    // Refresh sidebar
    await loadCollections();
    // Auto-expand the target collection
    const docContainer = document.getElementById('docs-' + data.document.collection_id);
    if (docContainer) {
      docContainer.classList.add('open');
      const header = document.querySelector(`.collection-header[data-col-id="${data.document.collection_id}"]`);
      if (header) header.querySelector('.arrow').textContent = '▼';
    }
    // Auto-select the new document
    selectDocument(data.document.id);

    // If detected chapters, show import dialog
    const chapters = data.document && data.document.detected_chapters;
    console.log('[Chapters] detected:', chapters ? chapters.length : 0, chapters ? chapters.slice(0, 2) : []);
    if (chapters && Array.isArray(chapters) && chapters.length > 0) {
      showChaptersDialog(chapters, data.document.id);
    }
  } catch (e) {
    showMsg(document.getElementById('sidebarMsg'), '❌ 分析失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '📥 导入';
  }
}

// ══════════════════════════════════════════════════════════════
// Translate
// ══════════════════════════════════════════════════════════════

async function startTranslate() {
  if (translating || !currentDocId) return;
  translating = true;

  const engine = document.getElementById('engineSelect').value;
  console.log(`[Translate] engine=${engine}, doc=${currentDocId}`);

  // Switch to progress button
  const btn = document.getElementById('translateBtn');
  const prog = document.getElementById('translateProgress');
  const tpf = document.getElementById('tpfFill');
  const tpText = document.getElementById('tpText');
  btn.style.display = 'none';
  prog.style.display = 'inline-flex';
  tpf.style.width = '0%';
  tpText.textContent = '⏳ 翻译中...';

  // Also show the old progress bar for reference
  showProgress(0);

  try {
    const res = await fetch('/api/reader/translate/' + encodeURIComponent(currentDocId), {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN},
      body: JSON.stringify({lang: '中文', engine: engine}),
    });

    if (!res.ok) {
      const err = await res.json();
      if (err.detail) {
        localStorage.removeItem('mini_agent_token');
        localStorage.removeItem('mini_agent_user');
        window.location.href = '/auth';
      }
      showMsg(document.getElementById('sidebarMsg'), '❌ ' + (err.detail || err.error || '翻译失败'), 'error');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let total = 1;
    let done = 0;

    while (true) {
      const {done: streamDone, value} = await reader.read();
      if (streamDone) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;
        try {
          const event = JSON.parse(raw);
          handleTranslateEvent(event);
          if (event.type === 'progress') {
            total = event.total || 1;
          }
          if (event.type === 'para_done') {
            done++;
            const pct = Math.round((done / total) * 100);
            showProgress(pct);
            tpf.style.width = pct + '%';
            tpText.textContent = `🌐 ${done}/${total}`;
          }
          if (event.type === 'all_done') {
            done = event.done || done;
            total = event.total || total;
            showProgress(100);
            tpf.style.width = '100%';
            tpText.textContent = `✅ ${done}/${total}`;
          }
        } catch (e) {}
      }
    }

    // Re-read document to get fresh data
    await selectDocument(currentDocId);

    showMsg(document.getElementById('sidebarMsg'), `✅ 翻译完成 (${done}/${total})`, 'success', 4000);
    refreshSidebar();

  } catch (e) {
    showMsg(document.getElementById('sidebarMsg'), '❌ 翻译失败: ' + e.message, 'error');
  } finally {
    translating = false;
    prog.style.display = 'none';
    btn.style.display = '';
    setTimeout(hideProgress, 2000);
  }
}

function handleTranslateEvent(event) {
  switch (event.type) {
    case 'start':
      break;
    case 'progress':
      break;
    case 'para_start': {
      // Update paragraph status in currentDocData
      const sec = currentDocData?.[event.sec_index];
      if (sec) {
        const para = sec.paragraphs?.[event.para_index];
        if (para && para.status === 'wait') {
          para.status = 'translating';
        }
      }
      break;
    }
    case 'para_done': {
      // Update the paragraph
      const sec = currentDocData?.[event.sec_index];
      if (sec) {
        const para = sec.paragraphs?.[event.para_index];
        if (para) {
          para.status = 'done';
          para.trans_html = event.trans_html || '';
        }
      }
      // Live update this paragraph
      const blocks = document.querySelectorAll('.para-block');
      for (const block of blocks) {
        if (parseInt(block.dataset.secIdx) === event.sec_index &&
            parseInt(block.dataset.paraIdx) === event.para_index) {
          if (currentView === 'interleaved') {
            const transDiv = block.querySelector('.para-trans');
            if (transDiv) {
              transDiv.className = 'para-trans';
              transDiv.style.color = '';
              transDiv.style.borderLeftColor = '';
              transDiv.innerHTML = event.trans_html || '';
            }
          } else {
            const transPane = block.querySelector('.trans-pane > div:last-child');
            if (transPane) {
              transPane.innerHTML = event.trans_html || '';
            }
          }
          break;
        }
      }
      break;
    }
    case 'para_error': {
      const sec = currentDocData?.[event.sec_index];
      if (sec) {
        const para = sec.paragraphs?.[event.para_index];
        if (para) para.status = 'error';
      }
      break;
    }
    case 'all_done':
      break;
    case 'error':
      showMsg(document.getElementById('sidebarMsg'), '❌ ' + (event.content || '翻译出错'), 'error');
      break;
  }
}

function showNewCollectionDialog() {
  document.getElementById('newColDialog').classList.add('show');
  document.getElementById('newColName').value = '';
  document.getElementById('newColName').focus();
}

function closeNewCol() {
  document.getElementById('newColDialog').classList.remove('show');
}

async function confirmNewCol() {
  const name = document.getElementById('newColName').value.trim();
  if (!name) return;
  closeNewCol();
  try {
    await fetchApi('/api/reader/collections', {
      method: 'POST',
      body: JSON.stringify({name}),
    });
    await loadCollections();
  } catch (e) {
    showMsg(document.getElementById('sidebarMsg'), '创建失败: ' + e.message, 'error');
  }
}

async function deleteCollection(colId) {
  if (!confirm('确认删除这个书架及其所有文档？')) return;
  try {
    await fetchApi('/api/reader/collections/' + encodeURIComponent(colId), {
      method: 'DELETE',
    });
    if (currentDocId) {
      currentDocId = null;
      currentDocData = null;
      document.getElementById('mainHeader').style.display = 'none';
      document.getElementById('readerContent').innerHTML =
        `<div class="empty-state"><div class="icon">📖</div><p>选择一篇文章阅读</p></div>`;
    }
    await loadCollections();
  } catch (e) {
    showMsg(document.getElementById('sidebarMsg'), '删除失败: ' + e.message, 'error');
  }
}

function showNewDocDialog(colId) {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) {
    document.getElementById('urlInput').focus();
    showMsg(document.getElementById('sidebarMsg'), '先输入 URL', 'warn', 2000);
    return;
  }
  // 直接导入到指定书架
  document.getElementById('urlInput').focus();
  analyzeUrl(colId);
}

async function deleteDocument() {
  if (!currentDocId || !confirm('确认删除这个文档？翻译内容也将一并删除。')) return;
  try {
    await fetchApi('/api/reader/documents/' + encodeURIComponent(currentDocId), {
      method: 'DELETE',
    });
    currentDocId = null;
    currentDocData = null;
    document.getElementById('mainHeader').style.display = 'none';
    document.getElementById('readerContent').innerHTML =
      `<div class="empty-state"><div class="icon">📖</div><p>选择一篇文章阅读</p></div>`;
    await loadCollections();
  } catch (e) {
    showMsg(document.getElementById('sidebarMsg'), '删除失败: ' + e.message, 'error');
  }
}

function toggleMergeInput() {
  const el = document.getElementById('mergeInput');
  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen) {
    document.getElementById('mergeUrlInput').value = '';
    document.getElementById('mergeUrlInput').focus();
  }
}

async function mergeChapter() {
  const url = document.getElementById('mergeUrlInput').value.trim();
  if (!url) {
    showMsg(document.getElementById('sidebarMsg'), '请输入章节 URL', 'error', 3000);
    return;
  }
  if (!currentDocId) return;

  const btn = document.querySelector('#mergeInput .btn-primary');
  btn.disabled = true;
  btn.textContent = '⏳ 合并中...';

  try {
    const data = await fetchApi('/api/reader/merge/' + encodeURIComponent(currentDocId), {
      method: 'POST',
      body: JSON.stringify({url}),
    });
    if (data.error) {
      showMsg(document.getElementById('sidebarMsg'), '❌ ' + data.error, 'error');
      return;
    }
    showMsg(document.getElementById('sidebarMsg'),
      `✅ 合并成功：已添加 ${data.added_sections} 章 ${data.added_paragraphs} 段`,
      'success', 4000);
    document.getElementById('mergeInput').style.display = 'none';
    // Refresh the document view
    await loadCollections();
    selectDocument(currentDocId);
  } catch (e) {
    showMsg(document.getElementById('sidebarMsg'), '❌ 合并失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '合并';
  }
}

// ══════════════════════════════════════════════════════════════
// Tencent Translation / Engine
// ══════════════════════════════════════════════════════════════

function onEngineChange() {
  const engine = document.getElementById('engineSelect').value;
  localStorage.setItem('translate_engine', engine);
}

function loadEnginePref() {
  const saved = localStorage.getItem('translate_engine');
  if (saved) {
    document.getElementById('engineSelect').value = saved;
  }
}

function showTencentConfig() {
  document.getElementById('tencentDialog').classList.add('show');
  document.getElementById('tencentMsg').className = 'msg';
  // Load existing keys
  loadTencentStatus();
}

function closeTencentConfig() {
  document.getElementById('tencentDialog').classList.remove('show');
}

async function loadTencentStatus() {
  try {
    const data = await fetchApi('/api/key/tencent');
    if (data.has_id) {
      document.getElementById('tencentSecretId').placeholder = 'SecretId ✓ 已配置';
    }
    if (data.has_key) {
      document.getElementById('tencentSecretKey').placeholder = 'SecretKey ✓ 已配置';
    }
  } catch (e) {}
}

async function saveTencentConfig() {
  const secretId = document.getElementById('tencentSecretId').value.trim();
  const secretKey = document.getElementById('tencentSecretKey').value.trim();
  if (!secretId || !secretKey) {
    document.getElementById('tencentMsg').textContent = 'SecretId 和 SecretKey 不能为空';
    document.getElementById('tencentMsg').className = 'msg show error';
    return;
  }
  try {
    const data = await fetchApi('/api/key/tencent', {
      method: 'POST',
      body: JSON.stringify({ secret_id: secretId, secret_key: secretKey }),
    });
    if (data.message) {
      document.getElementById('tencentMsg').textContent = data.message;
      document.getElementById('tencentMsg').className = 'msg show success';
      document.getElementById('tencentSecretId').value = '';
      document.getElementById('tencentSecretKey').value = '';
      document.getElementById('tencentSecretId').placeholder = 'SecretId ✓ 已配置';
      document.getElementById('tencentSecretKey').placeholder = 'SecretKey ✓ 已配置';
    }
  } catch (e) {
    document.getElementById('tencentMsg').textContent = '保存失败: ' + e.message;
    document.getElementById('tencentMsg').className = 'msg show error';
  }
}

async function deleteTencentConfig() {
  try {
    const data = await fetchApi('/api/key/tencent', { method: 'DELETE' });
    document.getElementById('tencentMsg').textContent = data.message;
    document.getElementById('tencentMsg').className = 'msg show info';
    document.getElementById('tencentSecretId').placeholder = 'SecretId';
    document.getElementById('tencentSecretKey').placeholder = 'SecretKey';
  } catch (e) {
    document.getElementById('tencentMsg').textContent = '清除失败: ' + e.message;
    document.getElementById('tencentMsg').className = 'msg show error';
  }
}

// ══════════════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════════════

// Sidebar collapse toggle
function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const isCollapsed = sidebar.classList.toggle('collapsed');
  localStorage.setItem('reader_sidebar_collapsed', isCollapsed ? '1' : '');
}

// Restore sidebar state
const sidebar = document.querySelector('.sidebar');
if (localStorage.getItem('reader_sidebar_collapsed') === '1') {
  sidebar.classList.add('collapsed');
}

loadCollections();
loadEnginePref();
</script>
