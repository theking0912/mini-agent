<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Agent</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #252535;
    --border: #2e2e42;
    --text: #e4e4ed;
    --text2: #9090a8;
    --primary: #6c5ce7;
    --primary-dim: #4834d4;
    --success: #00b894;
    --warn: #fdcb6e;
    --error: #e17055;
    --radius: 10px;
    --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  /* ── Model Selector ── */
  .model-select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  .model-select:focus { border-color: var(--primary); }
  .model-select option { background: var(--surface); }

  .key-indicator {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .key-indicator.ok { background: var(--success); }
  .key-indicator.missing { background: var(--error); }

  /* ── Buttons ── */
  .btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--primary); border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dim); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* ── Chat Area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.assistant .label {
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .msg.assistant .label .model-tag {
    color: var(--text2);
    font-weight: 400;
  }
  .msg.assistant pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin: 8px 0;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 13px;
  }
  .msg.assistant code {
    background: var(--bg);
    padding: 1px 4px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .msg.assistant p { margin: 4px 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 4px 0; padding-left: 20px; }

  .msg.tool-call {
    align-self: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text2);
    font-family: var(--mono);
    animation: fadeIn .2s ease;
    max-width: 90%;
    text-align: center;
  }

  .msg.error {
    align-self: center;
    background: rgba(225, 112, 85, .15);
    border: 1px solid var(--error);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--error);
    max-width: 90%;
  }

  .no-key-card {
    align-self: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 360px;
    text-align: center;
    animation: fadeIn .3s ease;
  }
  .no-key-icon { font-size: 36px; margin-bottom: 12px; }
  .no-key-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .no-key-desc { font-size: 13px; color: var(--text2); margin-bottom: 18px; line-height: 1.5; }
  .no-key-card .btn { font-size: 14px; padding: 10px 24px; }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text2);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* ── Input ── */
  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: var(--font);
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.5;
  }
  .input-bar textarea:focus { border-color: var(--primary); }
  .input-bar textarea::placeholder { color: var(--text2); }
  .input-bar .send-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    width: 42px; height: 42px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: background .15s;
    flex-shrink: 0;
  }
  .input-bar .send-btn:hover { background: var(--primary-dim); }
  .input-bar .send-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Mobile Responsive ── */
  @media (max-width: 520px) {
    header { padding: 8px 10px; }
    header h1 { font-size: 14px; }
    .header-actions { gap: 4px; }
    #modelStatus { display: none; }
    .btn-sm { padding: 3px 7px; font-size: 11px; }
    #modelSelector { max-width: 120px; font-size: 12px; padding: 4px 8px; }
    .input-bar { padding: 8px 10px; }
    .input-bar textarea { font-size: 16px; } /* 防 iOS 缩放 */
    #chat { padding: 12px 10px; }
    .msg { max-width: 90%; padding: 10px 12px; font-size: 14px; }
  }
  @media (max-width: 380px) {
    header h1 { font-size: 13px; }
    #modelSelector { max-width: 90px; }
  }

  /* ── Settings Panel ── */
  .settings-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .settings-overlay.open { display: flex; }
  .settings-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 480px;
    max-width: 90vw;
    max-height: 80vh;
    padding: 24px;
    display: flex;
    flex-direction: column;
  }
  .settings-panel h2 {
    font-size: 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .settings-panel h2 .close-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
  }
  .settings-section {
    margin-bottom: 20px;
  }
  .settings-section h3 {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  #profileAvatar:hover #avatarHoverHint { display: block; }

  /* ── Profile Tabs ── */
  .profile-tab {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    padding: 10px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .profile-tab:hover { color: var(--text); }
  .profile-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .profile-tab-content { display: none; }
  .profile-tab-content.active { display: block; }
  .settings-section label {
    display: block;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .settings-section input[type="password"],
  .settings-section input[type="text"] {
    width: 100%;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--mono);
    outline: none;
    margin-bottom: 8px;
  }
  .settings-section input:focus { border-color: var(--primary); }
  .settings-section .model-key-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .settings-section .model-key-item .name { font-size: 13px; }
  .settings-section .model-key-item .status { font-size: 12px; }
  .key-save-btn {
    width: 100%;
    margin-top: 4px;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    gap: 8px;
  }
  .empty-state .icon { font-size: 48px; opacity: .3; }
  .empty-state p { font-size: 14px; }
  .empty-state .hint { font-size: 12px; color: var(--text2); opacity: .6; }
</style>
</head>
<body>

<!-- Header -->
<header>
  <h1><span>✦</span> Mini Agent</h1>
  <div class="header-actions">
    <span id="modelStatus" style="font-size:12px;color:var(--text2)"></span>
    <select id="modelSelector" class="model-select"></select>
    <button class="btn btn-sm" onclick="openProfile('info')" id="profileBtn" style="width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:var(--primary)">
      <span id="headerAvatarFallback" style="font-size:14px;color:white;display:flex;align-items:center;justify-content:center;width:100%;height:100%">👤</span>
      <img id="headerAvatar" src="" style="width:100%;height:100%;object-fit:cover;display:none" onerror="this.style.display='none';document.getElementById('headerAvatarFallback').style.display='flex'">
    </button>
  </div>
</header>

<!-- Chat -->
<div id="chat">
  <div class="empty-state" id="emptyState">
    <div class="icon">✦</div>
    <p>开始对话</p>
    <p class="hint">在下方的输入框中输入消息</p>
  </div>
</div>

<!-- Input -->
<div class="input-bar">
  <button class="btn btn-sm" onclick="resetChat()" title="重置对话" style="flex-shrink:0;height:42px;width:36px;padding:0;font-size:16px;line-height:1">↺</button>
  <textarea id="input" rows="1" placeholder="输入消息..." 
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
    oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
</div>

<!-- Profile & Settings（统一弹窗，Tab 切换） -->
<div class="settings-overlay" id="profileOverlay">
  <div class="settings-panel" style="width:520px">
    <h2 style="margin-bottom:0">
      <span id="profilePanelTitle">👤 个人中心</span>
      <button class="close-btn" onclick="closeProfile()">✕</button>
    </h2>

    <!-- Tab bar -->
    <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;margin-top:16px;flex-shrink:0">
      <button class="profile-tab active" data-tab="info" onclick="switchProfileTab('info')">👤 个人信息</button>
      <button class="profile-tab" data-tab="keys" onclick="switchProfileTab('keys')">🔑 API Key</button>
    </div>

    <!-- Tab 内容（共享滚动容器，确保两个 Tab 高度一致） -->
    <div style="flex:1;overflow-y:auto;min-height:0">
      <!-- Tab: 个人信息 -->
      <div id="profileTabInfo" class="profile-tab-content active">
      <div class="settings-section">
        <div style="text-align:center;padding:12px 0">
          <div style="width:80px;height:80px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:32px;color:white;margin:0 auto 8px;overflow:hidden;position:relative;cursor:pointer" id="profileAvatar" onclick="document.getElementById('avatarInput').click()" title="点击更换头像">
            <span id="profileAvatarFallback" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">?</span>
            <img id="profileAvatarImg" src="" style="width:100%;height:100%;object-fit:cover;display:none" onerror="this.style.display='none';document.getElementById('profileAvatarFallback').style.display='flex'">
            <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:white;font-size:11px;padding:3px 0;display:none" id="avatarHoverHint">更换</div>
          </div>
          <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" capture="environment" style="display:none" onchange="uploadAvatar(this.files[0])">
          <div id="avatarUploadStatus" style="font-size:12px;color:var(--text2);min-height:18px;margin-bottom:4px"></div>
          <div style="font-size:15px;font-weight:600" id="profileName">—</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px" id="profileEmail">—</div>
        </div>
      </div>
      <div class="settings-section">
        <button class="btn" style="width:100%;text-align:left" onclick="resetChat()">↺ 重置对话</button>
      </div>
      <div class="settings-section">
        <button class="btn" style="width:100%;color:var(--error);border-color:var(--error);text-align:center" onclick="logout()">🚪 退出登录</button>
      </div>
    </div>

    <!-- Tab: API Key -->
    <div id="profileTabKeys" class="profile-tab-content">
      <div class="settings-section">
        <h3>已保存的 Key</h3>
        <div id="keyList"></div>
      </div>
      <div class="settings-section">
        <h3>添加 / 更新 Key</h3>
        <label>模型</label>
        <select id="keyModelSelect" style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:8px;outline:none"></select>
        <label>API Key</label>
        <input type="password" id="keyInput" placeholder="sk-xxx...xxxx">
        <button class="btn btn-primary key-save-btn" onclick="saveKey()">保存 Key</button>
      </div>
      <div class="settings-section">
        <h3>关于</h3>
        <p style="font-size:13px;color:var(--text2);line-height:1.6">
          代码: <a href="https://github.com/theking0912/mini-agent" target="_blank" style="color:var(--primary)">github.com/theking0912/mini-agent</a>
        </p>
      </div>
    </div>
    </div>
  </div>
</div>

<script>
// ── 动态视口高度（解决移动端地址栏/键盘弹起） ──
function fixViewport() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
  document.body.style.height = 'calc(var(--vh, 1vh) * 100)';
}
fixViewport();
window.addEventListener('resize', fixViewport);
window.addEventListener('orientationchange', function() { setTimeout(fixViewport, 200); });

// ── Auth check ──
const TOKEN = localStorage.getItem('mini_agent_token');
if (!TOKEN) {
  window.location.href = '/auth';
}

function authHeaders(extra) {
  return {...extra, 'Authorization': 'Bearer ' + TOKEN};
}

// ── State ──
let isStreaming = false;
let abortController = null;

// ── Init ──
async function init() {
  // 验证 token 是否有效
  try {
    const res = await fetch('/api/auth/me', {headers: {'Authorization': 'Bearer ' + TOKEN}});
    const data = await res.json();
    if (!data.user) {
      localStorage.removeItem('mini_agent_token');
      window.location.href = '/auth';
    }
    // 加载头部头像
    loadHeaderAvatar(data.user);
  } catch {
    window.location.href = '/auth';
  }
  await loadModels();
  await loadKeys();
}
init();

function loadHeaderAvatar(user) {
  if (!user) return;
  const email = user.email || '';
  const name = user.display_name || email.split('@')[0];
  const img = document.getElementById('headerAvatar');
  const fallback = document.getElementById('headerAvatarFallback');
  fallback.textContent = name[0].toUpperCase();
  img.src = '/api/avatar/' + user.id + '?t=' + Date.now();
  img.onload = function() {
    fallback.style.display = 'none';
    img.style.display = 'block';
  };
}

// ── Models ──
async function loadModels() {
  const res = await fetch('/api/models', {headers: authHeaders({})});
  const data = await res.json();
  const sel = document.getElementById('modelSelector');
  const keyModelSel = document.getElementById('keyModelSelect');
  sel.innerHTML = '';
  keyModelSel.innerHTML = '';

  data.models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.name;
    opt.textContent = `${m.description}`;
    if (m.current) opt.selected = true;
    sel.appendChild(opt);

    const opt2 = document.createElement('option');
    opt2.value = m.name;
    opt2.textContent = m.name;
    keyModelSel.appendChild(opt2);
  });

  updateModelStatus(data);
}

function updateModelStatus(data) {
  const current = data.models.find(m => m.name === data.current);
  if (!current) return;
  const el = document.getElementById('modelStatus');
  if (current.has_key) {
    el.innerHTML = '<span style="color:var(--success);font-size:11px">● Key 已配置</span>';
  } else {
    el.innerHTML = '<span style="color:var(--error);font-size:11px">● Key 未配置</span>';
  }
}

document.getElementById('modelSelector').addEventListener('change', async function() {
  const res = await fetch('/api/switch', {
    method: 'POST',
    headers: authHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify({model: this.value})
  });
  const data = await res.json();
  if (data.message) addToolMsg(data.message);
  await loadModels();
});

// ── Keys ──
async function loadKeys() {
  const res = await fetch('/api/key/list', {headers: authHeaders({})});
  const data = await res.json();
  const models = data.keys || [];
  const currentModel = data.current || '';
  
  // 更新 Key 列表展示（含真实状态 + 当前模型标记）
  const el = document.getElementById('keyList');
  el.innerHTML = '';
  for (const m of models) {
    const dot = m.has_key ? '<span style="color:var(--success)">●</span>' : '<span style="color:var(--error)">●</span>';
    const status = m.has_key ? '已配置' : '未配置';
    const active = m.name === currentModel ? ' <span style="color:var(--primary);font-size:11px">← 当前</span>' : '';
    const div = document.createElement('div');
    div.className = 'model-key-item';
    div.innerHTML = `
      <span class="name">${dot} ${m.name}${active} <span style="font-size:12px;color:var(--text2)">${status}</span></span>
    `;
    el.appendChild(div);
  }

  // 更新下拉框，标记哪些模型已有 Key 并显示当前模型
  const sel = document.getElementById('keyModelSelect');
  for (const opt of sel.options) {
    const m = models.find(x => x.name === opt.value);
    if (m) {
      const dot = m.has_key ? '●' : '○';
      const cur = m.name === currentModel ? ' ★' : '';
      opt.textContent = m.name + ' ' + dot + cur;
    }
  }
}

async function saveKey() {
  const model = document.getElementById('keyModelSelect').value;
  const key = document.getElementById('keyInput').value.trim();
  if (!key) return alert('请输入 API Key');
  const res = await fetch('/api/key/set', {
    method: 'POST',
    headers: authHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify({model, key})
  });
  const data = await res.json();
  if (data.message) {
    document.getElementById('keyInput').value = '';
    await loadKeys();
    await loadModels();
    addToolMsg(data.message);
  }
}

async function removeKey(model) {
  if (!confirm(`确定删除 ${model} 的 Key？`)) return;
  const res = await fetch('/api/key/remove', {
    method: 'POST',
    headers: authHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify({model})
  });
  const data = await res.json();
  if (data.message) {
    await loadKeys();
    await loadModels();
    addToolMsg(data.message);
  }
}

// ── Profile（统一弹窗，Tab 切换） ──
function openProfile(tab) {
  document.getElementById('profileOverlay').classList.add('open');
  switchProfileTab(tab || 'info');
  if (tab === 'info') loadProfileInfo();
  if (tab === 'keys') loadKeys();
}
function switchProfileTab(tab) {
  // 切换 Tab 按钮高亮
  document.querySelectorAll('.profile-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  // 切换内容面板
  document.getElementById('profileTabInfo').classList.toggle('active', tab === 'info');
  document.getElementById('profileTabKeys').classList.toggle('active', tab === 'keys');
  // 更新标题
  const titles = { info: '👤 个人中心', keys: '🔑 API Key 管理' };
  document.getElementById('profilePanelTitle').textContent = titles[tab] || '👤 个人中心';
  if (tab === 'info') loadProfileInfo();
  if (tab === 'keys') loadKeys();
}
document.getElementById('profileOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeProfile();
});

// ── Chat ──
async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || isStreaming) return;

  input.value = '';
  autoResize(input);
  hideEmptyState();

  // Add user message
  addMsg(msg, 'user');

  // Show typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.id = 'typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('chat').appendChild(typingEl);
  scrollToBottom();

  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  abortController = new AbortController();

  // Create assistant message container
  const assistantDiv = document.createElement('div');
  assistantDiv.className = 'msg assistant';
  assistantDiv.id = 'assistantMsg';
  
  const modelName = document.getElementById('modelSelector').selectedOptions[0]?.textContent || '';
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `✦ <span class="model-tag">${modelName}</span>`;
  assistantDiv.appendChild(label);
  
  const contentDiv = document.createElement('div');
  contentDiv.id = 'assistantContent';
  assistantDiv.appendChild(contentDiv);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({message: msg}),
      signal: abortController.signal
    });

    // Remove typing indicator
    const typing = document.getElementById('typing');
    if (typing) typing.remove();

    document.getElementById('chat').appendChild(assistantDiv);
    scrollToBottom();

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          
          if (data.type === 'token') {
            contentDiv.textContent += data.content;
            scrollToBottom();
          } else if (data.type === 'tool_call') {
            const calls = data.tool_calls.map(tc => 
              `🔧 ${tc.name}(${JSON.stringify(tc.arguments)})`
            ).join(', ');
            addToolMsg(calls);
          } else if (data.type === 'tool_result') {
            addToolMsg(`✅ ${data.name}: ${data.result.slice(0, 100)}`);
          } else if (data.type === 'no_key') {
            contentDiv.className = 'no-key-card';
            contentDiv.innerHTML = `
              <div class="no-key-icon">🔑</div>
              <div class="no-key-title">还没设置 API Key</div>
              <div class="no-key-desc">当前模型「${data.model}」需要 API Key 才能对话</div>
              <button class="btn btn-primary" onclick="openProfile('keys')">⚙ 去设置 Key</button>
            `;
            scrollToBottom();
          } else if (data.type === 'error') {
            contentDiv.className = 'no-key-card';
            contentDiv.innerHTML = `
              <div class="no-key-icon">⚠️</div>
              <div class="no-key-title">API Key 无效或已过期</div>
              <div class="no-key-desc">当前模型「${data.model || getCurrentModel()}」的 Key 无法连接到 API，请检查或重新设置</div>
              <button class="btn btn-primary" onclick="openProfile('keys')">⚙ 去重新设置</button>
            `;
            scrollToBottom();
          } else if (data.type === 'done') {
            // done
          }
        } catch(e) {
          // skip parse errors
        }
      }
    }
  } catch(e) {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
    if (e.name !== 'AbortError') {
      addToolMsg('❌ ' + e.message, 'error');
    }
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
  scrollToBottom();
}

function addMsg(text, role) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'user') {
    div.textContent = text;
  } else {
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = '✦';
    div.appendChild(label);
    const content = document.createElement('div');
    content.textContent = text;
    div.appendChild(content);
  }
  chat.appendChild(div);
  scrollToBottom();
}

function getCurrentModel() {
  const sel = document.getElementById('modelSelector');
  return sel?.selectedOptions[0]?.textContent?.split(' ')[0] || 'deepseek';
}

function addToolMsg(text, type) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = type === 'error' ? 'msg error' : 'msg tool-call';
  div.textContent = text;
  chat.appendChild(div);
  scrollToBottom();
}

async function resetChat() {
  if (isStreaming && abortController) {
    abortController.abort();
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
  }
  const res = await fetch('/api/reset', {method: 'POST', headers: authHeaders()});
  const data = await res.json();
  document.getElementById('chat').innerHTML = '';
  showEmptyState();
  addToolMsg(data.message);
}

function hideEmptyState() {
  const el = document.getElementById('emptyState');
  if (el) el.style.display = 'none';
}
function showEmptyState() {
  const el = document.getElementById('emptyState');
  if (el) el.style.display = 'flex';
}

function scrollToBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

// ── Profile ──
let currentUser = null;

async function loadProfileInfo() {
  document.getElementById('avatarUploadStatus').textContent = '';
  try {
    const res = await fetch('/api/auth/me', {headers: {'Authorization': 'Bearer ' + TOKEN}});
    const data = await res.json();
    if (data.user) {
      currentUser = data.user;
      const email = data.user.email || '';
      const name = data.user.display_name || email.split('@')[0];
      // 同时加载 img 和 fallback，img 成功后隐藏 fallback
      const img = document.getElementById('profileAvatarImg');
      const fallback = document.getElementById('profileAvatarFallback');
      fallback.style.display = 'flex';
      fallback.textContent = name[0].toUpperCase();
      img.style.display = 'none';
      img.src = '/api/avatar/' + data.user.id + '?t=' + Date.now();
      img.onload = function() {
        fallback.style.display = 'none';
        img.style.display = 'block';
      };
      document.getElementById('profileName').textContent = name;
      document.getElementById('profileEmail').textContent = email;
    }
  } catch {}
}

async function uploadAvatar(file) {
  if (!file) return;
  const status = document.getElementById('avatarUploadStatus');
  status.textContent = '⏳ 上传中...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/avatar/upload', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + TOKEN},
      body: formData,
    });
    const data = await res.json();
    if (data.error) {
      status.textContent = '❌ ' + data.error;
    } else {
      status.textContent = '✅ 头像已更新';
      // 通过代理 URL 刷新头像（不用 MinIO 直连 URL，浏览器可能跨域/网络不可达）
      const userId = currentUser?.id;
      const img = document.getElementById('profileAvatarImg');
      const fallback = document.getElementById('profileAvatarFallback');
      const name = document.getElementById('profileName').textContent;
      fallback.style.display = 'flex';
      fallback.textContent = name[0].toUpperCase();
      img.style.display = 'none';
      img.src = (userId ? '/api/avatar/' + userId : data.url) + '?t=' + Date.now();
      img.onload = function() {
        fallback.style.display = 'none';
        img.style.display = 'block';
      };
      // 同时更新头部头像
      const avatarEl = document.getElementById('headerAvatar');
      if (avatarEl && userId) {
        avatarEl.src = '/api/avatar/' + userId + '?t=' + Date.now();
      }
      setTimeout(() => { status.textContent = ''; }, 3000);
    }
  } catch (e) {
    status.textContent = '❌ 上传失败: ' + e.message;
  }
}

function closeProfile() {
  document.getElementById('profileOverlay').classList.remove('open');
}

async function logout() {
  if (!confirm('确定退出登录？')) return;
  await fetch('/api/auth/logout', {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + TOKEN}
  });
  localStorage.removeItem('mini_agent_token');
  window.location.href = '/auth';
}

// 按 Escape 关闭所有弹窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    const input = document.getElementById('input');
    if (document.activeElement === input) send();
  }
  if (e.key === 'Escape') {
    closeProfile();
  }
});
</script>
