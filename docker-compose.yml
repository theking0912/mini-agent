version: "3.8"
services:
  mini-agent:
    image: mini-agent:latest
    container_name: mini-agent
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      # ── LLM API Key ────────────────────────────────
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # ── 固定 salt（永不漂移，容器随便重启） ─────────
      - MINI_AGENT_KEY_SALT=mini-agent-fixed-salt-2026
      # ── 数据库 ─────────────────────────────────────
      - PG_HOST=172.17.0.1
      - PG_PORT=5433
      - PG_USER=leroy
      - PG_DATABASE=mini_agent
      # ── Redis ───────────────────────────────────────
      - REDIS_HOST=172.17.0.1
      - REDIS_PORT=6379
      # ── JWT ─────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET}
    # ── Volume：持久化 keyring（salt + keys.enc） ────
    volumes:
      - ./data:/data
    networks:
      - hermes_net

networks:
  hermes_net:
    external: true
