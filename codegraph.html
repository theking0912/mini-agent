#app{width:100vw;height:100vh;position:relative;overflow:hidden}

canvas{display:block;width:100vw;height:100vh;cursor:grab}

#panel.open{right:0}

#panel .header .kind-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
#panel .header h2{font-size:15px;font-weight:700;color:#0f172a;word-break:break-all}
#panel .close-btn{width:28px;height:28px;border-radius:6px;border:none;background:rgba(148,163,184,.1);color:#64748b;cursor:pointer}
#panel .body{flex:1;overflow-y:auto;padding:16px 20px 40px}
#panel .section h3{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(203,213,225,.2)}
#panel .dep-item{cursor:pointer;font-size:12px;padding:6px 8px;border-radius:6px;display:flex;align-items:center;gap:8px;color:#334155;border-left:3px solid transparent}
#panel .dep-item:hover{background:rgba(148,163,184,.08)}
#legend{position:fixed;bottom:20px;left:20px;z-index:50;background:rgba(255,255,255,.93);border:1px solid rgba(203,213,225,.5);border-radius:10px;padding:12px 14px;font-size:11px;backdrop-filter:blur(12px);max-width:380px;max-height:40vh;overflow-y:auto;box-shadow:0 2px 12px rgba(0,0,0,.04)}
#legend .legend-title{font-weight:600;color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
#legend .legend-grid{display:flex;flex-wrap:wrap;gap:3px 8px}
#legend .legend-item{display:flex;align-items:center;gap:4px;color:#475569;font-size:10px;padding:2px 4px;border-radius:4px}
#legend .legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#controls{position:fixed;bottom:20px;right:20px;z-index:50;display:flex;flex-direction:column;gap:6px}
#controls button{width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:rgba(255,255,255,.9);color:#64748b;cursor:pointer;font-size:16px;backdrop-filter:blur(8px);transition:all .15s}
#settings{position:fixed;bottom:72px;right:20px;z-index:50;display:none;background:rgba(255,255,255,.95);border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;backdrop-filter:blur(12px);min-width:180px}
#settings.open{display:block}
#settings label{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#64748b;margin:4px 0}
#settings input[type=range]{width:90px}
#stats{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(255,255,255,.85);border:1px solid #e2e8f0;border-radius:8px;padding:5px 12px;font-size:10px;color:#94a3b8;backdrop-filter:blur(8px);white-space:nowrap;display:flex;gap:16px}
#loading{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#f8fafc;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .6s}
#loading.hidden{opacity:0;pointer-events:none}
#loading .spinner{width:32px;height:32px;border:3px solid rgba(255,107,53,.15);border-top-color:#FF6B35;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){header{padding:10px 14px}#legend{max-width:280px;max-height:30vh}}

let W,H, nodes=DATA.nodes, edges=DATA.edges, areaColors=DATA.areaColors;
const nodeMap={}, adj={};
nodes.forEach(n=>{nodeMap[n.id]=n; adj[n.id]={out:[],inp:[]};});
edges.forEach(e=>{if(adj[e.source])adj[e.source].out.push(e);if(adj[e.target])adj[e.target].inp.push(e);});

const kindColors={"function": "#3B82F6", "class": "#FF6B35", "method": "#10B981", "route": "#8B5CF6"}, kindLabels={"function": "函数", "class": "模型类", "method": "方法", "route": "路由"}, edgeKindLabels={"calls": "调用", "contains": "包含", "extends": "继承", "imports": "导入", "instantiates": "实例化", "references": "引用"}, edgeColors={"calls": "rgba(59,130,246,", "contains": "rgba(148,163,184,", "extends": "rgba(255,107,53,", "imports": "rgba(148,163,184,", "instantiates": "rgba(139,92,246,", "references": "rgba(20,184,166,"};
const areaLabels={"agent":"入口","core":"核心","redundant":"冗余","server":"服务","tests":"测试","tools":"工具"};

// Merge duplicates
const areaMerge={'pets':'pet','orders':'order','services':'service','notifications':'notification','members':'member','products':'product','users':'user','customers':'customer'};
nodes.forEach(n=>{if(areaMerge[n.area])n.area=areaMerge[n.area];});

// Redundant detection
const edgeRefs=new Set();
DATA.edges.forEach(e=>{edgeRefs.add(e.source);edgeRefs.add(e.target);});
nodes.forEach(n=>{if(!edgeRefs.has(n.id)){n.area='redundant';}});
DATA.areaColors['redundant']='#94a3b8';

const areaCounts={};
nodes.forEach(n=>{areaCounts[n.area]=(areaCounts[n.area]||0)+1;});
const topAreas=Object.entries(areaCounts).sort((a,b)=>b[1]-a[1]);

const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d',{alpha:false});
function fitCanvas(){W=window.innerWidth;H=window.innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.scale(devicePixelRatio,devicePixelRatio);}
fitCanvas();window.addEventListener('resize',fitCanvas);

let cam={x:0,y:0,zoom:1};
const w2s=(wx,wy)=>[(wx-cam.x)*cam.zoom+W/2,(wy-cam.y)*cam.zoom+H/2];
const s2w=(sx,sy)=>[(sx-W/2)/cam.zoom+cam.x,(sy-H/2)/cam.zoom+cam.y];

function autoFit(){let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;nodes.forEach(n=>{if(n.x<a)a=n.x;if(n.x>b)b=n.x;if(n.y<c)c=n.y;if(n.y>d)d=n.y;});cam.x=(a+b)/2;cam.y=(c+d)/2;cam.zoom=Math.min(W/(b-a+200),H/(d-c+200),1.2);}
function getRadius(n){return n.kind==='class'?5:n.kind==='method'?4:3.5;}
function getRelated(n){const s=new Set();s.add(n.id);if(adj[n.id]){adj[n.id].out.forEach(e=>s.add(e.target));adj[n.id].inp.forEach(e=>s.add(e.source));}return s;}
function getRelatedEdges(n){const s=new Set();if(adj[n.id]){adj[n.id].out.forEach(e=>s.add(e.source+'→'+e.target));adj[n.id].inp.forEach(e=>s.add(e.source+'→'+e.target));}return s;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let hoveredNode=null,selectedNode=null;
const searchInput=document.getElementById('search');
const panelBody=document.getElementById('panelBody'),pkName=document.getElementById('pkName'),pkKind=document.getElementById('pkKind'),pkFile=document.getElementById('pkFile'),pkLine=document.getElementById('pkLine');
const tooltip=document.getElementById('tooltip'),panel=document.getElementById('panel'),loading=document.getElementById('loading');

function openPanel(n){selectedNode=n;pkName.textContent=n.name;const kc=kindColors[n.kind]||'#94a3b8';pkKind.textContent=kindLabels[n.kind]||n.kind;pkKind.style.background=kc+'22';pkKind.style.color=kc;pkFile.textContent=n.file;pkLine.textContent=n.line?':'+n.line:'';let h='';if(n.sig)h+='<div class="section"><h3>签名</h3><div class="sig">'+esc(n.sig)+'</div></div>';if(adj[n.id]&&adj[n.id].out.length){h+='<div class="section"><h3>依赖 ('+adj[n.id].out.length+')</h3>';adj[n.id].out.forEach(e=>{const t=nodeMap[e.target];if(!t)return;h+='<div class="dep-item" onclick="focusNode(\''+e.target+'\')"><span class="dep-name">'+esc(t.name)+'</span></div>';});h+='</div>';}if(adj[n.id]&&adj[n.id].inp.length){h+='<div class="section"><h3>被依赖 ('+adj[n.id].inp.length+')</h3>';adj[n.id].inp.forEach(e=>{const s=nodeMap[e.source];if(!s)return;h+='<div class="dep-item" onclick="focusNode(\''+e.source+'\')"><span class="dep-name">'+esc(s.name)+'</span></div>';});h+='</div>';}panelBody.innerHTML=h;panel.classList.add('open');render();}
document.getElementById('panelClose').addEventListener('click',()=>{panel.classList.remove('open');selectedNode=null;render();});
function focusNode(id){const n=nodeMap[id];if(!n)return;openPanel(n);cam.x=n.x;cam.y=n.y;render();}

let flowSpeed=0.005,glowMultiplier=0.5,hiddenAreas=new Set(),hoveredArea=null;
document.getElementById('speedSlider').addEventListener('input',function(){flowSpeed=this.value/1000;document.getElementById('speedVal').textContent=flowSpeed.toFixed(3);});
document.getElementById('glowSlider').addEventListener('input',function(){glowMultiplier=this.value/10;document.getElementById('glowVal').textContent=glowMultiplier.toFixed(1);});
document.getElementById('toggleSettings').addEventListener('click',()=>document.getElementById('settings').classList.toggle('open'));

const areaBounds={};
nodes.forEach(n=>{if(!areaBounds[n.area])areaBounds[n.area]={minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity};const b=areaBounds[n.area];if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});

// Radiate nodes within each area
(function(){Object.keys(areaBounds).forEach(area=>{const an=nodes.filter(n=>n.area===area);if(an.length<3)return;const ec={};an.forEach(n=>ec[n.id]=0);DATA.edges.forEach(e=>{if(ec[e.source]!==undefined)ec[e.source]++;if(ec[e.target]!==undefined)ec[e.target]++;});const vals=Object.values(ec),mx=Math.max(...vals),mn=Math.min(...vals),rng=mx-mn||1;const cx=(areaBounds[area].minX+areaBounds[area].maxX)/2,cy=(areaBounds[area].minY+areaBounds[area].maxY)/2,bw=areaBounds[area].maxX-areaBounds[area].minX,bh=areaBounds[area].maxY-areaBounds[area].minY,mr=Math.max(bw,bh)*0.42;an.forEach(n=>{const e=ec[n.id]||0,nor=1-(e-mn)/rng,d=nor*nor*mr,ang=Math.atan2(n.y-cy,n.x-cx)||Math.random()*Math.PI*2;n.x=cx+Math.cos(ang)*d;n.y=cy+Math.sin(ang)*d;});});Object.keys(areaBounds).forEach(a=>{const b=areaBounds[a];b.minX=Infinity;b.maxX=-Infinity;b.minY=Infinity;b.maxY=-Infinity;});nodes.forEach(n=>{const b=areaBounds[n.area];if(!b)return;if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});})();

// Re-layout areas in order of edge connectivity, no overlap
(function(){const ec={};Object.keys(areaBounds).forEach(a=>ec[a]=0);DATA.edges.forEach(e=>{const sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn)return;if(sn.area===tn.area){ec[sn.area]=(ec[sn.area]||0)+1;}else{ec[sn.area]=(ec[sn.area]||0)+1;ec[tn.area]=(ec[tn.area]||0)+1;}});const sa=Object.keys(areaBounds).sort((a,b)=>(ec[b]||0)-(ec[a]||0));let mw=0,mh=0;sa.forEach(a=>{const b=areaBounds[a],w=b.maxX-b.minX,h=b.maxY-b.minY;if(w>mw)mw=w;if(h>mh)mh=h;});const cw=mw+100,ch=mh+80,cols=Math.max(1,Math.ceil(Math.sqrt(sa.length)));sa.forEach((a,i)=>{const col=i%cols,row=Math.floor(i/cols),tx=col*cw+cw/2,ty=row*ch+ch/2,b=areaBounds[a];const dx=tx-(b.minX+b.maxX)/2,dy=ty-(b.minY+b.maxY)/2;nodes.filter(n=>n.area===a).forEach(n=>{n.x+=dx;n.y+=dy;});});Object.keys(areaBounds).forEach(k=>{const b=areaBounds[k];b.minX=Infinity;b.maxX=-Infinity;b.minY=Infinity;b.maxY=-Infinity;});nodes.forEach(n=>{const b=areaBounds[n.area];if(!b)return;if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});})();

// Legend
const legendDiv=document.getElementById('legend');
function buildLegend(){let h='<div class="legend-title">按功能分组</div><div class="legend-grid">';const fa=topAreas.filter(([a])=>!hiddenAreas.has(a));topAreas.forEach(([a,c])=>{const co=areaColors[a]||'#64748b',hid=hiddenAreas.has(a);h+='<div class="legend-item" style="cursor:pointer;opacity:'+(hid?'.3':'1')+'" onclick="toggleArea(\''+a+'\')" onmouseenter="hoveredArea=\''+a+'\';render()" onmouseleave="hoveredArea=null;render()"><span class="legend-dot" style="background:'+co+';'+(hid?'background:#475569':'')+'"></span>'+(areaLabels[a]||a)+' '+c+'</div>';});h+='</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px;border-top:1px solid rgba(203,213,225,.2);padding-top:4px"><span style="font-size:9px;color:#475569">'+(hiddenAreas.size?fa.length+'/'+topAreas.length:'全部')+'</span><span style="display:flex;gap:6px"><span onclick="selectAllAreas()" style="font-size:9px;color:#FF6B35;cursor:pointer;font-weight:600">全选</span><span onclick="deselectAllAreas()" style="font-size:9px;color:#94a3b8;cursor:pointer">全不选</span></span></div>';legendDiv.innerHTML=h;}
function toggleArea(a){if(hiddenAreas.has(a))hiddenAreas.delete(a);else hiddenAreas.add(a);if(hiddenAreas.size>=topAreas.length)hiddenAreas.clear();buildLegend();render();}
function selectAllAreas(){hiddenAreas.clear();buildLegend();render();}
function deselectAllAreas(){topAreas.forEach(([a])=>hiddenAreas.add(a));buildLegend();render();}
buildLegend();

document.getElementById('zoomIn').addEventListener('click',()=>{cam.zoom*=1.3;render();});
document.getElementById('zoomOut').addEventListener('click',()=>{cam.zoom/=1.3;render();});
document.getElementById('reset').addEventListener('click',()=>{autoFit();panel.classList.remove('open');selectedNode=null;hoveredNode=null;render();});
document.getElementById('toggleLegend').addEventListener('click',()=>legendDiv.classList.toggle('show'));

// Animation
let animPulses=[],animFlowId=null;
function initFlow(){const ae=edges.filter(e=>nodeMap[e.source]&&nodeMap[e.target]);for(const e of ae){for(let j=0;j<10;j++){animPulses.push({edge:e,progress:-j*0.1,speed:flowSpeed,maxProgress:1});}}if(!animFlowId)animateFlow();}
function animateFlow(){for(const p of animPulses){p.progress+=p.speed;if(p.progress>=1){p.progress=-0.1-Math.random()*0.3;p.speed=flowSpeed;}}animFlowId=requestAnimationFrame(animateFlow);render();}

// Interaction
let isDrag=false,dsX,dsY,csX,csY,clickNode=null,dragArea=null,adX,adY;
canvas.addEventListener('mousedown',e=>{const[wx,wy]=s2w(e.clientX,e.clientY);clickNode=hitTest(wx,wy);isDrag=false;dragArea=null;if(!clickNode){for(const a of Object.keys(areaBounds)){if(hiddenAreas.has(a))continue;const b=areaBounds[a];if(wx>=b.minX-20&&wx<=b.maxX+20&&wy>=b.minY-20&&wy<=b.minY-20+22/cam.zoom+4){dragArea=a;adX={};adY={};nodes.filter(n=>n.area===a).forEach(n=>{adX[n.id]=n.x;adY[n.id]=n.y;});canvas.style.cursor='move';break;}}}dsX=e.clientX;dsY=e.clientY;csX=cam.x;csY=cam.y;});
canvas.addEventListener('mousemove',e=>{const[wx,wy]=s2w(e.clientX,e.clientY);const hit=hitTest(wx,wy);if(hit!==hoveredNode){hoveredNode=hit;render();}canvas.style.cursor=hoveredNode?'pointer':(dragArea?'move':'grab');if(hit){tooltip.style.display='block';const kc=kindColors[hit.kind]||'#94a3b8';tooltip.innerHTML='<b style="color:'+kc+'">'+esc(hit.name)+'</b> <span style="color:#94a3b8;font-size:11px">'+(areaLabels[hit.area]||hit.area)+' · '+hit.file+(hit.line?':'+hit.line:'')+'</span>';let tx=e.clientX+14,ty=e.clientY-10;tooltip.style.left=Math.max(4,tx)+'px';tooltip.style.top=Math.max(4,ty)+'px';}else tooltip.style.display='none';if(e.buttons===0){isDrag=false;dragArea=null;return;}const dx=e.clientX-dsX,dy=e.clientY-dsY;if(!isDrag&&!dragArea&&dx*dx+dy*dy<25)return;if(dragArea){const ddx=dx/cam.zoom,ddy=dy/cam.zoom;nodes.filter(n=>n.area===dragArea).forEach(n=>{n.x=adX[n.id]+ddx;n.y=adY[n.id]+ddy;});const b=areaBounds[dragArea];b.minX=Infinity;b.maxX=-Infinity;b.minY=Infinity;b.maxY=-Infinity;nodes.filter(n=>n.area===dragArea).forEach(n=>{if(n.x<b.minX)b.minX=n.x;if(n.x>b.maxX)b.maxX=n.x;if(n.y<b.minY)b.minY=n.y;if(n.y>b.maxY)b.maxY=n.y;});isDrag=true;canvas.style.cursor='move';render();return;}isDrag=true;cam.x=csX-(e.clientX-dsX)/cam.zoom;cam.y=csY-(e.clientY-dsY)/cam.zoom;canvas.style.cursor='grabbing';render();});
canvas.addEventListener('mouseup',e=>{const h=hoveredNode||clickNode;if(!isDrag){if(h)openPanel(h);else{panel.classList.remove('open');selectedNode=null;render();}}isDrag=false;clickNode=null;dragArea=null;canvas.style.cursor=hoveredNode?'pointer':'grab';});
canvas.addEventListener('mouseleave',()=>{isDrag=false;clickNode=null;dragArea=null;canvas.style.cursor='grab';});
canvas.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?.9:1.1;[wx,wy]=s2w(e.clientX,e.clientY);cam.zoom=Math.max(0.05,Math.min(3,cam.zoom*d));cam.x=wx-(e.clientX-W/2)/cam.zoom;cam.y=wy-(e.clientY-H/2)/cam.zoom;render();},{passive:false});

let touches=[],lastTouchDist=0,touchSN=null;
canvas.addEventListener('touchstart',e=>{e.preventDefault();touches=Array.from(e.touches);if(touches.length===1){const[wx,wy]=s2w(touches[0].clientX,touches[0].clientY);touchSN=hitTest(wx,wy);isDrag=false;dsX=touches[0].clientX;dsY=touches[0].clientY;csX=cam.x;csY=cam.y;}else if(touches.length===2){touchSN=null;lastTouchDist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);csX=cam.x;csY=cam.y;isDrag=true;}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=Array.from(e.touches);if(t.length===1){const dx=t[0].clientX-dsX,dy=t[0].clientY-dsY;if(!isDrag&&dx*dx+dy*dy<25)return;isDrag=true;cam.x=csX-(t[0].clientX-dsX)/cam.zoom;cam.y=csY-(t[0].clientY-dsY)/cam.zoom;render();}else if(t.length===2){const dist=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),scale=dist/lastTouchDist;midX=(t[0].clientX+t[1].clientX)/2;midY=(t[0].clientY+t[1].clientY)/2;[wx,wy]=s2w(midX,midY);newZoom=Math.max(0.05,Math.min(3,cam.zoom*scale));cam.x=wx-(midX-W/2)/newZoom;cam.y=wy-(midY-H/2)/newZoom;cam.zoom=newZoom;lastTouchDist=dist;render();}},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(!isDrag){const h=hoveredNode||touchSN;if(h)openPanel(h);}isDrag=false;touchSN=null;touches=[];},{passive:false});

function hitTest(mx,my){let b=null,bd=Infinity;for(const n of nodes){const dx=n.x-mx,dy=n.y-my,d=Math.sqrt(dx*dx+dy*dy);if(d<getRadius(n)+20/cam.zoom&&d<bd){b=n;bd=d;}}return b;}

// Render
function render(){ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,W,H);if(!nodes.length)return;
const act=hoveredNode||selectedNode;
const hlN=new Set(),hlE=new Set();
if(act){getRelated(act).forEach(i=>hlN.add(i));getRelatedEdges(act).forEach(k=>hlE.add(k));}
const nf=hiddenAreas.size?n=>!hiddenAreas.has(n.area):()=>true;
for(const e of edges){if(hiddenAreas.size){const sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn||hiddenAreas.has(sn.area)||hiddenAreas.has(tn.area))continue;}const sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn)continue;const[sx,sy]=w2s(sn.x,sn.y),[tx,ty]=w2s(tn.x,tn.y);const ek=e.source+'→'+e.target;const isH=act&&hlE.has(ek);let a=act?(isH?.7:.04):.15;if(a<.03)continue;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);const ec=edgeColors[e.kind]||'rgba(148,163,184,';ctx.strokeStyle=ec+a+')';ctx.lineWidth=isH?2:.8;ctx.stroke();}
for(const p of animPulses){if(p.progress<0||p.progress>1)continue;const e=p.edge;if(hiddenAreas.size){const sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn||hiddenAreas.has(sn.area)||hiddenAreas.has(tn.area))continue;}const sn=nodeMap[e.source],tn=nodeMap[e.target];if(!sn||!tn)continue;const t=Math.min(1,Math.max(0,p.progress));const px=sn.x+(tn.x-sn.x)*t,py=sn.y+(tn.y-sn.y)*t;[sx,sy]=w2s(px,py);const ps=Math.max(3,1.5*cam.zoom),al=1-Math.abs(t-.5)*1.2;const ec2=edgeColors[e.kind]||'rgba(148,163,184,';const g=ctx.createRadialGradient(sx,sy,0,sx,sy,ps*glowMultiplier);g.addColorStop(0,ec2+al+')');g.addColorStop(1,ec2+'0)');ctx.beginPath();ctx.arc(sx,sy,ps*glowMultiplier,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(sx,sy,Math.max(2,ps*.5),0,Math.PI*2);ctx.fillStyle=ec2+al+')';ctx.fill();}
for(const area of Object.keys(areaBounds)){if(hiddenAreas.size&&hiddenAreas.has(area))continue;const b=areaBounds[area];const bn=nodes.filter(n=>n.area===area);if(bn.length<2)continue;const[sx,sy]=w2s(b.minX-20,b.minY-20),[ex,ey]=w2s(b.maxX+20,b.maxY+20);const bw=ex-sx,bh=ey-sy;if(bw<2||bh<2)continue;const c=areaColors[area]||'#94a3b8',iaH=hoveredArea&&area===hoveredArea,iD=hoveredArea&&area!==hoveredArea;ctx.fillStyle=c+(iaH?'30':iD?'08':'18');ctx.beginPath();ctx.roundRect(sx,sy,bw,bh,10);ctx.fill();ctx.fillStyle=c+(iaH?'60':iD?'15':'40');ctx.beginPath();ctx.roundRect(sx,sy,bw,22,10);ctx.fill();ctx.strokeStyle=c+(iaH?'60':iD?'10':'35');ctx.lineWidth=iaH?2:1;ctx.beginPath();ctx.roundRect(sx,sy,bw,bh,10);ctx.stroke();const lb=areaLabels[area]||area;ctx.font=(iaH?'bold 12px':'bold 10px')+' sans-serif';ctx.fillStyle=iD?'#94a3b8':'#0f172a';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(lb,sx+8,sy+11);}
const lbs=[];
for(const n of nodes){if(!nf(n))continue;const[sx,sy]=w2s(n.x,n.y),r=Math.max(2,getRadius(n)*cam.zoom);const isH=n===hoveredNode,isS=n===selectedNode,isA=act&&hlN.has(n.id);const aDim=hoveredArea&&n.area!==hoveredArea?.15:1;let a=isH||isS?1:isA?.85:act?.12:.7;a*=aDim;if(a<.05)continue;const c=kindColors[n.kind]||'#94a3b8',ac=areaColors[n.area]||'#94a3b8',ab=(areaLabels[n.area]||n.area).slice(0,2);if(isH||isS){const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r*4);g.addColorStop(0,c+'44');g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(sx,sy,r*4,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}ctx.globalAlpha=a*.18;ctx.beginPath();ctx.arc(sx,sy,r+18,0,Math.PI*2);ctx.fillStyle=ac;ctx.fill();ctx.globalAlpha=a*.7;ctx.beginPath();ctx.arc(sx,sy,r+3,0,Math.PI*2);ctx.strokeStyle=ac;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(isH||isS){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.globalAlpha=.8;ctx.stroke();}ctx.globalAlpha=1;if(cam.zoom>.4||isH||isS)lbs.push({n,sx,sy,isH,isS,a});}
lbs.sort((a,b)=>(b.isH||b.isS?2:1)-(a.isH||a.isS?2:1));
const pl=[];
for(const it of lbs){const n=it.n,sx=it.sx,sy=it.sy,isH=it.isH,isS=it.isS,a=it.a;let la=.4+a*.4;if(isH||isS)la=1;if(la<.3)continue;let lb=n.name;if(lb.length>24)lb=lb.slice(0,22)+'…';const fs=isH||isS?11:10;ctx.font=fs+'px sans-serif';const tw=ctx.measureText(lb).width;let tx=sx+8+getRadius(n),ty=sy+3,conf=false;for(const p of pl){if(Math.abs(p.x-tx)<p.w+tw+8&&Math.abs(p.y-ty)<16){conf=true;break;}}if(isH||isS||!conf){const ac2=areaColors[n.area]||'#94a3b8',ab2=(areaLabels[n.area]||n.area).slice(0,2);ctx.font='7px sans-serif';const aw=ctx.measureText(ab2).width+5;ctx.fillStyle=ac2+'40';ctx.beginPath();ctx.roundRect(tx-3,ty-fs*.8,aw,fs+6,2);ctx.fill();ctx.fillStyle=ac2;ctx.globalAlpha=la;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ab2,tx-3+aw/2,ty);ctx.globalAlpha=1;const nx=tx-3+aw+2;ctx.font=fs+'px sans-serif';ctx.fillStyle='rgba(255,255,255,'+la*.9+')';ctx.beginPath();ctx.roundRect(nx,ty-fs*.8,tw+6,fs+6,3);ctx.fill();ctx.fillStyle=isH?'#0f172a':(kindColors[n.kind]||'#475569');ctx.globalAlpha=la;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(lb,nx+3,ty);ctx.globalAlpha=1;pl.push({x:nx,y:ty,w:tw+6+aw+2});}}
document.getElementById('nodeCount').textContent=nodes.filter(nf).length;
}

if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){if(r>w/2)r=w/2;if(r>h/2)r=h/2;this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);};}

autoFit();loading.classList.add('hidden');initFlow();requestAnimationFrame(()=>render());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.classList.remove('open');selectedNode=null;hoveredNode=null;render();}});
</script>
</body>
